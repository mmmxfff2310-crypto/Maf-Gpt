    }

    function scrollToBottom() {
      const scroller = document.getElementById('messagesScroll');
      if (scroller) {
        scroller.scrollTop = scroller.scrollHeight;
      }
    }

    function copyTextToClipboard(text) {
      if (!text) return;
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('Скопировано');
      } catch (_) {}
      document.body.removeChild(ta);
    }

    function copyMessageText(index) {
      const chat = getActiveChat();
      if (!chat || !chat.messages[index]) return;
      copyTextToClipboard(chat.messages[index].text || '');
    }

    function editUserMessage(index) {
      const chat = getActiveChat();
      if (!chat || !chat.messages[index]) return;
      const input = document.getElementById('promptInput');
      if (input) {
        input.value = chat.messages[index].text || '';
        updateActionButtonState();
        input.focus();
      }
    }

    function toggleMessageFeedback(index, type) {
      const chat = getActiveChat();
      if (!chat || !chat.messages[index]) return;
      chat.messages[index].feedback = chat.messages[index].feedback === type ? null : type;
      saveChats();
      renderChatMessages();
    }

    function shareOrDownloadMessage(index) {
      const chat = getActiveChat();
      if (!chat || !chat.messages[index]) return;
      const msg = chat.messages[index];
      if (msg.generatedImageUrl) {
        const a = document.createElement('a');
        a.href = msg.generatedImageUrl;
        a.download = 'maf-gpt-image-' + Date.now() + '.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('Фото сохранено');
        return;
      }
      if (navigator.share && msg.text) {
        navigator.share({ title: 'Maf GPT', text: msg.text }).catch(() => {});
      } else {
        copyTextToClipboard(msg.text || '');
      }
    }

    /**
     * Однопроходный безопасный токенизатор кода
     */
    function highlightCode(rawCode, lang) {
      const code = String(rawCode || '');
      const l = (lang || '').toLowerCase();
      if (l === 'html' || l === 'xml' || l === 'svg') {
        return code.replace(
          /(<!--[\s\S]*?-->)|(<\/?)([a-zA-Z0-9-]+)([^>]*?)(\/?>)|("[^"]*"|'[^']*')/g,
          (m, cmt, openBracket, tagName, attrs, closeBracket, str) => {
            if (cmt) return `<span class="tok-cmt">${escapeHtml(cmt)}</span>`;
            if (str) return `<span class="tok-str">${escapeHtml(str)}</span>`;
            if (tagName) {
              const highlightedAttrs = (attrs || '').replace(
                /([a-zA-Z0-9:-]+)(=)("[^"]*"|'[^']*')/g,
                (_, aName, eq, aVal) =>
                  `<span class="tok-attr">${escapeHtml(aName)}</span>${escapeHtml(eq)}<span class="tok-str">${escapeHtml(aVal)}</span>`
              );
              return `${escapeHtml(openBracket)}<span class="tok-tag">${escapeHtml(tagName)}</span>${highlightedAttrs}${escapeHtml(closeBracket)}`;
            }
            return escapeHtml(m);
          }
        );
      }

      return code.replace(
        /(\/\/[^\n]*|\/\*[\s\S]*?\*\/|#[^\n]*)|("[^"\\]*(?:\\.[^"\\]*)*"|'[^'\\]*(?:\\.[^'\\]*)*'|`[^`\\]*(?:\\.[^`\\]*)*`)|\b(const|let|var|function|return|if|else|for|while|class|import|from|export|default|async|await|try|catch|new|def|print|elif|None|True|False|int|float|str|bool|public|private|void|static)\b|\b(\d+(?:\.\d+)?)\b/g,
        (m, cmt, str, kw, num) => {
          if (cmt) return `<span class="tok-cmt">${escapeHtml(cmt)}</span>`;
          if (str) return `<span class="tok-str">${escapeHtml(str)}</span>`;
          if (kw) return `<span class="tok-kw">${escapeHtml(kw)}</span>`;
          if (num) return `<span class="tok-num">${escapeHtml(num)}</span>`;
          return escapeHtml(m);
        }
      );
    }

    function copyCodeById(codeId) {
      const code = codeStore[codeId];
      if (code !== undefined) copyTextToClipboard(code);
    }

    function toggleCodeCollapse(codeId) {
      const pre = document.getElementById('pre_' + codeId);
      if (pre) pre.classList.toggle('code-collapsed');
    }

    function previewCodeById(codeId) {
      const code = codeStore[codeId];
      if (code === undefined) return;
      const modal = document.getElementById('codePreviewModal');
      const frame = document.getElementById('codePreviewFrame');
      if (!modal || !frame) return;
      const isHtml = /<!DOCTYPE|<html|<body|<div|<script|<style/i.test(code);
      frame.srcdoc = isHtml
        ? code
        : `<!DOCTYPE html><html><body style="background:#111;color:#eee;font-family:monospace;padding:16px;"><pre>${escapeHtml(code)}</pre></body></html>`;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeCodePreviewModal() {
      const modal = document.getElementById('codePreviewModal');
      const frame = document.getElementById('codePreviewFrame');
      if (frame) frame.srcdoc = '';
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    function formatInlineMarkdown(text) {
      let s = escapeHtml(text);
      s = s.replace(/`([^`]+)`/g, '<code class="rounded bg-[#262626] px-1.5 py-0.5 font-mono text-[13px] text-neutral-200">$1</code>');
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong class="font-semibold text-white">$1</strong>');
      s = s.replace(/\*([^*]+)\*/g, '<em class="italic text-neutral-200">$1</em>');
      return s;
    }

    function renderRichMarkdown(rawText) {
      const cleaned = sanitizeModelOutput(rawText);
      const parts = cleaned.split(/(```[\s\S]*?```)/g);
      return parts
        .map((part) => {
          if (part.startsWith('```') && part.endsWith('```')) {
            const inner = part.slice(3, -3);
            const firstNewline = inner.indexOf('\n');
            let lang = 'CODE';
            let codeContent = inner;
            if (firstNewline !== -1) {
              const possibleLang = inner.slice(0, firstNewline).trim();
              if (possibleLang && possibleLang.length <= 20 && !possibleLang.includes(' ')) {
                lang = possibleLang.toUpperCase();
                codeContent = inner.slice(firstNewline + 1);
              }
            }
            const codeId = 'cb_' + ++codeBlockCounter;
            codeStore[codeId] = codeContent;

            return `
              <div class="code-wrapper">
                <div class="code-header">
                  <div class="flex items-center gap-2">
                    <svg class="h-4 w-4 text-neutral-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="16 18 22 12 16 6" />
                      <polyline points="8 6 2 12 8 18" />
                    </svg>
                    <span>${escapeHtml(lang)}</span>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <button
                      type="button"
                      onclick="toggleCodeCollapse('${codeId}')"
                      title="Свернуть / развернуть"
                      class="flex h-7 w-7 items-center justify-center rounded-lg bg-transparent text-neutral-300 hover:bg-[#3f3f3f] hover:text-white"
                    >
                      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="4 14 10 14 10 20" />
                        <polyline points="20 10 14 10 14 4" />
                        <line x1="14" y1="10" x2="21" y2="3" />
                        <line x1="3" y1="21" x2="10" y2="14" />
                      </svg>
                    </button>
                    <button
                      type="button"
                      onclick="copyCodeById('${codeId}')"
                      title="Копировать код"
                      class="flex h-7 w-7 items-center justify-center rounded-lg bg-transparent text-neutral-300 hover:bg-[#3f3f3f] hover:text-white"
                    >
                      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
                        <rect x="9" y="9" width="13" height="13" rx="2" />
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                      </svg>
                    </button>
                    <button
                      type="button"
                      onclick="previewCodeById('${codeId}')"
                      title="Предпросмотр"
                      class="flex h-7 w-7 items-center justify-center rounded-lg bg-transparent text-neutral-300 hover:bg-[#3f3f3f] hover:text-white"
                    >
                      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3" />
                      </svg>
                    </button>
                  </div>
                </div>
                <pre id="pre_${codeId}" class="code-body"><code>${highlightCode(codeContent, lang)}</code></pre>
              </div>
            `;
          }

          const lines = part.split('\n');
          let html = '';
          let inUl = false;
          let inOl = false;

          const closeLists = () => {
            if (inUl) { html += '</ul>'; inUl = false; }
            if (inOl) { html += '</ol>'; inOl = false; }
          };

          for (const rawLine of lines) {
            const line = rawLine.trim();
            if (!line) {
              closeLists();
              continue;
            }
            if (line.startsWith('### ')) {
              closeLists();
              html += `<h3>${formatInlineMarkdown(line.slice(4))}</h3>`;
            } else if (line.startsWith('## ')) {
              closeLists();
              html += `<h2>${formatInlineMarkdown(line.slice(3))}</h2>`;
            } else if (line.startsWith('# ')) {
              closeLists();
              html += `<h1>${formatInlineMarkdown(line.slice(2))}</h1>`;
            } else if (/^[-*•]\s+/.test(line)) {
              if (inOl) { html += '</ol>'; inOl = false; }
              if (!inUl) { html += '<ul>'; inUl = true; }
              html += `<li>${formatInlineMarkdown(line.replace(/^[-*•]\s+/, ''))}</li>`;
            } else if (/^\d+\.\s+/.test(line)) {
              if (inUl) { html += '</ul>'; inUl = false; }
              if (!inOl) { html += '<ol>'; inOl = true; }
              html += `<li>${formatInlineMarkdown(line.replace(/^\d+\.\s+/, ''))}</li>`;
            } else {
              closeLists();
              html += `<p>${formatInlineMarkdown(line)}</p>`;
            }
          }
          closeLists();
          return html;
        })
        .join('');
    }

    function sanitizeModelOutput(text) {
      let s = String(text || '');
      s = s.replace(/<thought>[\s\S]*?<\/thought>/gi, '');
      s = s.replace(/\{\s*"action"\s*:\s*"dalle\.text2im"[\s\S]*?\}/gi, '');
      return s.trim();
    }

    /**
     * Работа с прикреплёнными изображениями
     */
    function handleImageSelected(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      compressImageFile(file);
      event.target.value = '';
    }

    function handleComposerPaste(event) {
      const items = event.clipboardData && event.clipboardData.items;
      if (!items) return;
      for (const item of items) {
        if (item.type && item.type.startsWith('image/')) {
          const file = item.getAsFile();
          if (file) {
            event.preventDefault();
            compressImageFile(file);
            break;
          }
        }
      }
    }

    function compressImageFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const maxSide = 1024;
          let w = img.width;
          let h = img.height;
          if (w > maxSide || h > maxSide) {
            if (w > h) {
              h = Math.round((h * maxSide) / w);
              w = maxSide;
            } else {
              w = Math.round((w * maxSide) / h);
              h = maxSide;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.84);
          const base64 = dataUrl.split(',')[1];
          state.attachedImage = {
            name: file.name || 'image.jpg',
            mimeType: 'image/jpeg',
            base64,
            dataUrl,
          };
          const previewCont = document.getElementById('imagePreviewContainer');
          const thumb = document.getElementById('imagePreviewThumb');
          const nameEl = document.getElementById('imagePreviewName');
          if (thumb) thumb.src = dataUrl;
          if (nameEl) nameEl.textContent = state.attachedImage.name;
          if (previewCont) previewCont.classList.remove('hidden');
          updateActionButtonState();
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function clearAttachedImage() {
      state.attachedImage = null;
      const previewCont = document.getElementById('imagePreviewContainer');
      if (previewCont) previewCont.classList.add('hidden');
      updateActionButtonState();
    }

    /**
     * Управление кнопкой отправки / голосового звонка
     */
    function updateActionButtonState() {
      const input = document.getElementById('promptInput');
      const sendBtn = document.getElementById('sendBtn');
      const iconVoice = document.getElementById('iconVoiceWave');
      const iconArrow = document.getElementById('iconSendArrow');
      if (!input || !sendBtn) return;

      const hasContent = input.value.trim().length > 0 || Boolean(state.attachedImage);
      if (hasContent) {
        sendBtn.classList.remove('bg-[#2563eb]', 'hover:bg-[#1d4ed8]', 'text-white');
        sendBtn.classList.add('bg-white', 'hover:bg-neutral-200', 'text-black');
        sendBtn.title = 'Отправить сообщение';
        if (iconVoice) iconVoice.classList.add('hidden');
        if (iconArrow) iconArrow.classList.remove('hidden');
      } else {
        sendBtn.classList.remove('bg-white', 'hover:bg-neutral-200', 'text-black');
        sendBtn.classList.add('bg-[#2563eb]', 'hover:bg-[#1d4ed8]', 'text-white');
        sendBtn.title = 'Голосовой разговор';
        if (iconArrow) iconArrow.classList.add('hidden');
        if (iconVoice) iconVoice.classList.remove('hidden');
      }
    }

    function handleComposerKeydown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        const input = document.getElementById('promptInput');
        if ((input && input.value.trim()) || state.attachedImage) {
          sendMessage();
        }
      }
    }

    function handlePrimaryActionClick() {
      const input = document.getElementById('promptInput');
      const hasContent = (input && input.value.trim().length > 0) || Boolean(state.attachedImage);
      if (hasContent) {
        sendMessage();
      } else {
        startLiveCall();
      }
    }

    function setGeneratingUI(active) {
      state.isGenerating = active;
      const stopBtn = document.getElementById('stopGeneratingBtn');
      if (stopBtn) {
        if (active) {
          stopBtn.classList.remove('hidden');
          stopBtn.classList.add('flex');
        } else {
          stopBtn.classList.add('hidden');
          stopBtn.classList.remove('flex');
        }
      }
    }

    function stopStreaming() {
      if (state.abortController) {
        try {
          state.abortController.abort();
        } catch (_) {}
        state.abortController = null;
      }
      setGeneratingUI(false);
      const chat = getActiveChat();
      if (chat && chat.messages.length) {
        const last = chat.messages[chat.messages.length - 1];
        if (last.role === 'model') {
          last.isStreaming = false;
          last.isImagePending = false;
        }
        saveChats();
        renderChatMessages();
      }
    }

    function isImageGenerationRequest(text) {
      const t = String(text || '').toLowerCase().trim();
      if (!t) return false;
      return /(нарисуй|сгенерируй\s+(фото|картинк|изображен|арт|рисунок)|создай\s+(фото|картинк|изображен|арт|рисунок)|сделай\s+(фото|картинк|изображен|арт|рисунок)|покажи\s+(фото|картинк)|draw\s+|generate\s+(an?\s+)?image)/i.test(t);
    }

    function isCodeRequest(text) {
      const t = String(text || '').toLowerCase();
      return /(напиши\s+код|сделай\s+код|создай\s+код|html|css|javascript|python|скрипт|сайт|страниц|игр[уы]|калькулятор)/i.test(t);
    }

    /**
     * Отправка сообщения и получение ответа от Gemini API
     */
    async function sendMessage(overrideText = null) {
      if (state.isGenerating) return;
      const input = document.getElementById('promptInput');
      const text = overrideText !== null ? String(overrideText).trim() : (input ? input.value.trim() : '');
      const attached = state.attachedImage;

      if (!text && !attached) return;

      const chat = ensureActiveChat();
      if (chat.messages.length === 0) {
        chat.title = (text || 'Фото').slice(0, 38);
      }

      chat.messages.push({
        role: 'user',
        text,
        imageDataUrl: attached ? attached.dataUrl : null,
        imageBase64: attached ? attached.base64 : null,
        imageMimeType: attached ? attached.mimeType : null,
      });

      if (overrideText === null && input) {
        input.value = '';
      }
      clearAttachedImage();
      updateActionButtonState();

      const wantImage = !attached && isImageGenerationRequest(text);

      chat.messages.push({
        role: 'model',
        text: '',
        isStreaming: !wantImage,
        isImagePending: wantImage,
        generatedImageUrl: null,
      });

      chat.updatedAt = Date.now();
      saveChats();
      renderSidebarHistory();
      renderChatMessages();

      setGeneratingUI(true);
      state.abortController = new AbortController();

      try {
        if (wantImage) {
          await generateImageResponse(chat, text, state.abortController.signal);
        } else {
          await generateTextResponse(chat, state.abortController.signal);
        }
      } catch (err) {
        if (err && err.name === 'AbortError') return;
        const msg = err && err.message ? err.message : 'Ошибка соединения';
        const last = chat.messages[chat.messages.length - 1];
        if (last && last.role === 'model') {
          last.isStreaming = false;
          last.isImagePending = false;
          last.isKeyError = /api key|not valid|permission|unauthenticated|401|403/i.test(msg);
          last.text = `Не удалось получить ответ (${escapePlainError(msg)}). Попробуйте ещё раз.`;
        }
      } finally {
        setGeneratingUI(false);
        state.abortController = null;
        saveChats();
        renderChatMessages();
      }
    }

    async function generateImageResponse(chat, promptText, signal) {
      // 1. Пробуем Imagen 3 через единый шлюз (чистый заголовок x-goog-api-key без дублирования ?key=)
      const { res, data } = await geminiApiRequest(
        'imagen-3.0-generate-002:predict',
        {
          instances: [{ prompt: promptText }],
          parameters: { sampleCount: 1 },
        },
        signal
      );

      if (res && res.ok) {
        const b64 = data?.predictions?.[0]?.bytesBase64Encoded;
        const mime = data?.predictions?.[0]?.mimeType || 'image/png';
        if (b64) {
          const last = chat.messages[chat.messages.length - 1];
          if (last && last.role === 'model') {
            last.isImagePending = false;
            last.isStreaming = false;
            last.generatedImageUrl = `data:${mime};base64,${b64}`;
            last.text = '';
          }
          return;
        }
      }

      // 2. Резервная генерация изображения через Gemini Image (если Imagen 3 недоступен для ключа)
      const imgFallback = await geminiApiRequest(
        'gemini-2.5-flash-image:generateContent',
        {
          contents: [{ parts: [{ text: promptText }] }],
          generationConfig: { responseModalities: ['IMAGE'] },
        },
        signal
      );

      if (imgFallback.res && imgFallback.res.ok) {
        const parts = imgFallback.data?.candidates?.[0]?.content?.parts || [];
        const imgPart = parts.find((p) => p.inlineData && p.inlineData.data);
        if (imgPart) {
          const last = chat.messages[chat.messages.length - 1];
          if (last && last.role === 'model') {
            last.isImagePending = false;
            last.isStreaming = false;
            last.generatedImageUrl = `data:${imgPart.inlineData.mimeType || 'image/png'};base64,${imgPart.inlineData.data}`;
            last.text = '';
          }
          return;
        }
      }

      throw new Error(data?.error?.message || imgFallback.data?.error?.message || `HTTP ${res ? res.status : 400}`);
    }

    async function generateTextResponse(chat, signal) {
      const systemInstruction = {
        parts: [
          {
            text: 'Ты — Maf GPT, умный и лаконичный AI-ассистент. Отвечай на русском языке чётко, по делу и хорошо структурированно. Никогда не выводи внутренние рассуждения (<thought>) и JSON-промпты генерации изображений (dalle.text2im). Если просят код, выдавай полный рабочий код в тройных обратных кавычках с указанием языка.',
          },
        ],
      };

      const contents = [];
      for (let i = 0; i < chat.messages.length - 1; i++) {
        const m = chat.messages[i];
        const parts = [];
        if (m.imageBase64) {
          parts.push({
            inlineData: {
              mimeType: m.imageMimeType || 'image/jpeg',
              data: m.imageBase64,
            },
          });
        }
        if (m.text) {
          parts.push({ text: m.text });
        }
        if (parts.length) {
          contents.push({
            role: m.role === 'user' ? 'user' : 'model',
            parts,
          });
        }
      }

      const bodyPayload = {
        systemInstruction,
        contents,
        generationConfig: {
          temperature: 0.7,
        },
      };

      const modelsToTry = ['gemini-2.5-flash', 'gemini-3-flash-preview', 'gemini-2.0-flash'];
      let lastError = null;

      for (const modelName of modelsToTry) {
        try {
          const { res, data } = await geminiApiRequest(`${modelName}:generateContent`, bodyPayload, signal);
          if (!res || !res.ok) {
            throw new Error(data?.error?.message || `HTTP ${res ? res.status : 400}`);
          }
          const replyText =
            data?.candidates?.[0]?.content?.parts
              ?.map((p) => p.text || '')
              .join('') || '';
          if (!replyText) {
            throw new Error('Пустой ответ модели');
          }
          const last = chat.messages[chat.messages.length - 1];
          if (last && last.role === 'model') {
            last.text = sanitizeModelOutput(replyText);
            last.isStreaming = false;
          }
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') throw err;
          lastError = err;
          if (/api key|not valid|permission denied|forbidden|403|401/i.test(err?.message || '')) {
            throw err;
          }
        }
      }

      throw lastError || new Error('Не удалось связаться с моделью');
    }

    /**
     * Живой голосовой разговор (звонок) — прямой захват PCM/WAV с микрофона + быстрый ответ и озвучка
     */
    const liveState = {
      active: false,
      muted: false,
      collapsed: false,
      mediaStream: null,
      audioCtx: null,
      analyser: null,
      scriptNode: null,
      vadFrameId: null,
      pcmBuffers: [],
      preRollBuffers: [],
      sampleRate: 16000,
      speechStarted: false,
      speechStartTime: 0,
      lastVoiceTime: 0,
      isSpeaking: false,
      isProcessing: false,
      recognition: null,
      sttFinalBuffer: '',
      sttSilenceTimer: null,
      currentAudio: null,
      lastHandledTranscript: '',
      lastHandledAt: 0,
    };

    function base64ToUint8Array(base64) {
      const binaryString = atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes;
    }

    function pcmToWavBlob(pcmBytes, sampleRate = 24000, numChannels = 1) {
      const dataLength = pcmBytes.byteLength;
      const buffer = new ArrayBuffer(44 + dataLength);
      const view = new DataView(buffer);

      const writeStr = (offset, str) => {
        for (let i = 0; i < str.length; i++) {
          view.setUint8(offset + i, str.charCodeAt(i));
        }
      };

      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + dataLength, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * numChannels * 2, true);
      view.setUint16(32, numChannels * 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, dataLength, true);

      new Uint8Array(buffer, 44).set(pcmBytes);
      return new Blob([buffer], { type: 'audio/wav' });
    }

    function float32ChunksToWavBlob(chunks, inputSampleRate) {
      let totalLen = 0;
      for (const c of chunks) totalLen += c.length;
      const merged = new Float32Array(totalLen);
      let offset = 0;
      for (const c of chunks) {
        merged.set(c, offset);
        offset += c.length;
      }

      // Даунсэмплинг до 16000 Гц для быстрой отправки и 100% совместимости с Gemini
      const targetRate = 16000;
      const ratio = inputSampleRate / targetRate;
      const outLen = Math.max(1, Math.floor(merged.length / ratio));
      const pcm16 = new Int16Array(outLen);
      for (let i = 0; i < outLen; i++) {
        const idx = Math.min(merged.length - 1, Math.floor(i * ratio));
        const s = Math.max(-1, Math.min(1, merged[idx]));
        pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      return pcmToWavBlob(new Uint8Array(pcm16.buffer), targetRate, 1);
    }

    function stopCurrentTtsAudio() {
      if (liveState.currentAudio) {
        try {
          liveState.currentAudio.pause();
          liveState.currentAudio.src = '';
        } catch (_) {}
        liveState.currentAudio = null;
      }
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch (_) {}
      }
      liveState.isSpeaking = false;
      const orb1 = document.getElementById('liveVoiceOrb');
      const orb2 = document.getElementById('dockedVoiceOrb');
      if (orb1) orb1.classList.remove('voice-orb-speaking');
      if (orb2) orb2.classList.remove('voice-orb-speaking');
    }

    function blobToBase64Raw(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          const res = String(reader.result || '');
          const idx = res.indexOf(',');
          resolve(idx !== -1 ? res.slice(idx + 1) : res);
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    function showLiveOverlayAnimated(show) {
      const overlay = document.getElementById('liveCallOverlay');
      if (!overlay) return;
      if (show) {
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            overlay.classList.remove('screen-hidden');
            overlay.classList.add('screen-visible');
          });
        });
      } else {
        overlay.classList.remove('screen-visible');
        overlay.classList.add('screen-hidden');
        setTimeout(() => {
          if (!liveState.active || liveState.collapsed) {
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
          }
        }, 320);
      }
    }

    function showDockedBarAnimated(show) {
      const dockedBar = document.getElementById('dockedCallBar');
      if (!dockedBar) return;
      if (show) {
        dockedBar.classList.remove('hidden');
        dockedBar.classList.add('flex');
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            dockedBar.classList.remove('docked-hidden');
            dockedBar.classList.add('docked-visible');
          });
        });
      } else {
        dockedBar.classList.remove('docked-visible');
        dockedBar.classList.add('docked-hidden');
        setTimeout(() => {
          if (!liveState.active || !liveState.collapsed) {
            dockedBar.classList.add('hidden');
            dockedBar.classList.remove('flex');
          }
        }, 280);
      }
    }

    async function startLiveCall() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      const hasMedia = Boolean(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

      if (!SpeechRec && !hasMedia) {
        showToast('Микрофон не поддерживается в этом браузере');
        return;
      }

      if ('speechSynthesis' in window) {
        try {
          const warmup = new SpeechSynthesisUtterance('');
          warmup.volume = 0;
          window.speechSynthesis.speak(warmup);
        } catch (_) {}
      }

      stopCurrentTtsAudio();
      liveState.active = true;
      liveState.muted = false;
      liveState.collapsed = false;
      liveState.isProcessing = false;
      liveState.speechStarted = false;
      liveState.pcmBuffers = [];
      liveState.preRollBuffers = [];
      liveState.sttFinalBuffer = '';
      liveState.lastHandledTranscript = '';
      liveState.lastHandledAt = 0;

      showLiveOverlayAnimated(true);
      const sub = document.getElementById('liveCallSubtitle');
      if (sub) sub.textContent = '';

      updateLiveCallStatus('Подключение микрофона...');
      updateLiveMuteUI();

      if (hasMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
            },
          });

          if (!liveState.active) {
            stream.getTracks().forEach((t) => t.stop());
            return;
          }

          liveState.mediaStream = stream;
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          liveState.audioCtx = new AudioCtx();
          if (liveState.audioCtx.state === 'suspended') {
            await liveState.audioCtx.resume();
          }
          liveState.sampleRate = liveState.audioCtx.sampleRate || 48000;

          const source = liveState.audioCtx.createMediaStreamSource(stream);
          const analyser = liveState.audioCtx.createAnalyser();
          analyser.fftSize = 1024;
          analyser.smoothingTimeConstant = 0.15;

          // Захват сырого PCM-потока напрямую из микрофона (без сбоев MediaRecorder/WebM)
          const scriptNode = liveState.audioCtx.createScriptProcessor(4096, 1, 1);
          const muteGain = liveState.audioCtx.createGain();
          muteGain.gain.value = 0;

          scriptNode.onaudioprocess = (e) => {
            if (!liveState.active || liveState.muted || liveState.isProcessing) return;
            const input = e.inputBuffer.getChannelData(0);
            const copy = new Float32Array(input.length);
            copy.set(input);

            if (liveState.speechStarted) {
              liveState.pcmBuffers.push(copy);
            } else {
              liveState.preRollBuffers.push(copy);
              if (liveState.preRollBuffers.length > 5) {
                liveState.preRollBuffers.shift();
              }
            }
          };

          source.connect(analyser);
          source.connect(scriptNode);
          scriptNode.connect(muteGain);
          muteGain.connect(liveState.audioCtx.destination);

          liveState.analyser = analyser;
          liveState.scriptNode = scriptNode;

          updateLiveCallStatus('Говорите...');
          startVoiceActivityDetection();
          return;
        } catch (err) {
          if (!SpeechRec) {
            showToast('Разрешите доступ к микрофону');
            stopLiveCall();
            return;
          }
        }
      }

      if (SpeechRec) {
        startBrowserSpeechRecognition(SpeechRec);
        updateLiveCallStatus('Говорите...');
      }
    }

    function startBrowserSpeechRecognition(SpeechRec) {
      try {
        const rec = new SpeechRec();
        rec.lang = 'ru-RU';
        rec.continuous = true;
        rec.interimResults = true;
        rec.maxAlternatives = 1;

        rec.onresult = (event) => {
          if (!liveState.active || liveState.muted || liveState.isProcessing) return;
          if (liveState.isSpeaking) stopCurrentTtsAudio();

          let interimText = '';
          let newFinal = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const res = event.results[i];
            const txt = res[0] ? res[0].transcript : '';
            if (res.isFinal) newFinal += txt + ' ';
            else interimText += txt;
          }

          if (newFinal) {
            liveState.sttFinalBuffer = (liveState.sttFinalBuffer + ' ' + newFinal).trim();
          }

          const preview = (liveState.sttFinalBuffer + ' ' + interimText).trim();
          if (preview) {
            updateLiveCallStatus('Слушаю вас...');
            const sub = document.getElementById('liveCallSubtitle');
            if (sub) sub.textContent = preview;
          }

          clearTimeout(liveState.sttSilenceTimer);
          liveState.sttSilenceTimer = setTimeout(() => {
            const readyText = (liveState.sttFinalBuffer || interimText).trim();
            liveState.sttFinalBuffer = '';
            if (readyText && liveState.active && !liveState.muted && !liveState.isProcessing) {
              handleLiveVoiceUtterance(readyText);
            }
          }, 550);
        };

        rec.onerror = () => {};
        rec.onend = () => {
          if (liveState.active && !liveState.muted) {
            setTimeout(() => {
              if (liveState.active && !liveState.muted && liveState.recognition) {
                try { liveState.recognition.start(); } catch (_) {}
              }
            }, 150);
          }
        };

        liveState.recognition = rec;
        rec.start();
      } catch (_) {}
    }

    function startVoiceActivityDetection() {
      if (!liveState.analyser) return;
      const dataArray = new Uint8Array(liveState.analyser.fftSize);
      const SILENCE_HANGOVER_MS = 650;
      const MIN_SPEECH_MS = 220;
      const MAX_SEGMENT_MS = 9000;

      const tick = () => {
        if (!liveState.active) return;
        liveState.vadFrameId = requestAnimationFrame(tick);

        liveState.analyser.getByteTimeDomainData(dataArray);
        let sumSquares = 0;
        for (let i = 0; i < dataArray.length; i++) {
          const v = dataArray[i] - 128;
          sumSquares += v * v;
        }
        const rms = Math.sqrt(sumSquares / dataArray.length);

        const fill = document.getElementById('micLevelFill');
        if (fill) {
          const pct = liveState.muted ? 0 : Math.min(100, Math.round(rms * 8));
          fill.style.width = pct + '%';
        }

        const orb1 = document.getElementById('liveVoiceOrb');
        const orb2 = document.getElementById('dockedVoiceOrb');
        if (!liveState.muted && !liveState.isSpeaking) {
          const scale = 1 + Math.min(0.28, Math.max(0, (rms - 0.8) * 0.025));
          if (orb1) orb1.style.transform = `scale(${scale.toFixed(3)})`;
          if (orb2) orb2.style.transform = `scale(${scale.toFixed(3)})`;
        } else {
          if (orb1) orb1.style.transform = '';
          if (orb2) orb2.style.transform = '';
        }

        if (liveState.muted || liveState.isProcessing) {
          return;
        }

        const threshold = liveState.isSpeaking ? 9.0 : 1.35;
        const now = performance.now();

        if (rms > threshold) {
          if (liveState.isSpeaking) {
            stopCurrentTtsAudio();
          }
          if (!liveState.speechStarted) {
            liveState.speechStarted = true;
            liveState.speechStartTime = now;
            liveState.pcmBuffers = liveState.preRollBuffers.slice();
            liveState.preRollBuffers = [];
            updateLiveCallStatus('Слушаю вас...');
          }
          liveState.lastVoiceTime = now;

          if (now - liveState.speechStartTime > MAX_SEGMENT_MS) {
            const captured = liveState.pcmBuffers.slice();
            liveState.pcmBuffers = [];
            liveState.speechStarted = false;
            processCapturedPcmSegment(captured);
          }
        } else if (liveState.speechStarted) {
          if (now - liveState.lastVoiceTime > SILENCE_HANGOVER_MS) {
            const duration = now - liveState.speechStartTime;
            const captured = liveState.pcmBuffers.slice();
            liveState.pcmBuffers = [];
            liveState.speechStarted = false;

            if (duration >= MIN_SPEECH_MS && captured.length > 0) {
              processCapturedPcmSegment(captured);
            } else {
              updateLiveCallStatus('Говорите...');
            }
          }
        }
      };

      liveState.vadFrameId = requestAnimationFrame(tick);
    }

    async function processCapturedPcmSegment(pcmChunks) {
      if (liveState.isProcessing || !liveState.active || !pcmChunks.length) return;
      liveState.isProcessing = true;
      updateLiveCallStatus('Распознаю речь...');

      try {
        const wavBlob = float32ChunksToWavBlob(pcmChunks, liveState.sampleRate);
        const audioBase64 = await blobToBase64Raw(wavBlob);

        const { res, data } = await geminiApiRequest('gemini-3.8-flash:generateContent', {
          contents: [
            {
              role: 'user',
              parts: [
                {
                  text: 'Расшифруй точно на русском языке, что сказал человек в этой аудиозаписи. Верни ТОЛЬКО произнесённый текст без кавычек и пояснений. Если речи нет и слышна только тишина или шум, верни слово ТИШИНА.',
                },
                {
                  inlineData: {
                    mimeType: 'audio/wav',
                    data: audioBase64,
                  },
                },
              ],
            },
          ],
          generationConfig: { temperature: 0.0, maxOutputTokens: 256 },
        });

        if (!res || !res.ok) {
          const errMsg = data?.error?.message || `Ошибка ${res ? res.status : 400}`;
          const sub = document.getElementById('liveCallSubtitle');
          if (sub) sub.textContent = errMsg;
          liveState.isProcessing = false;
          if (liveState.active) updateLiveCallStatus('Говорите...');
          return;
        }

        const rawTranscript = (
          data?.candidates?.[0]?.content?.parts?.map((p) => p.text || '').join('') || ''
        ).trim();

        if (!rawTranscript || /^тишина\.?$/i.test(rawTranscript)) {
          liveState.isProcessing = false;
          if (liveState.active) updateLiveCallStatus('Говорите...');
          return;
        }

        await handleLiveVoiceUtterance(rawTranscript);
      } catch (err) {
        const sub = document.getElementById('liveCallSubtitle');
        if (sub) sub.textContent = 'Ошибка сети при распознавании';
        liveState.isProcessing = false;
        if (liveState.active) updateLiveCallStatus('Говорите...');
      }
    }

    async function handleLiveVoiceUtterance(spokenText) {
      const normalized = String(spokenText || '').trim();
      if (!normalized) {
        liveState.isProcessing = false;
        if (liveState.active) updateLiveCallStatus('Говорите...');
        return;
      }

      const now = Date.now();
      if (
        normalized.toLowerCase() === liveState.lastHandledTranscript.toLowerCase() &&
        now - liveState.lastHandledAt < 3000
      ) {
        liveState.isProcessing = false;
        return;
      }
      liveState.lastHandledTranscript = normalized;
      liveState.lastHandledAt = now;

      liveState.isProcessing = true;
      updateLiveCallStatus('Думаю...');
      const sub = document.getElementById('liveCallSubtitle');
      if (sub) sub.textContent = normalized;

      const wantImg = isImageGenerationRequest(normalized);
      const wantCode = !wantImg && isCodeRequest(normalized);

      if (wantImg || wantCode) {
        setLiveCallCollapsed(true);
        const announce = wantImg
          ? 'Я создаю фото по вашему запросу, ожидайте!'
          : 'Я создаю код по вашему запросу, ожидайте!';
        speakLiveText(announce);
        await sendMessage(normalized);
        const doneMsg = wantImg
          ? 'Я создал фото по вашему запросу, посмотрите в чате!'
          : 'Я создал код по вашему запросу, он уже в чате!';
        await speakLiveText(doneMsg);
        liveState.isProcessing = false;
        if (liveState.active) updateLiveCallStatus('Говорите...');
        return;
      }

      await sendMessage(normalized);
      const chat = getActiveChat();
      const last = chat && chat.messages[chat.messages.length - 1];
      const answerText = last && last.role === 'model' ? last.text : '';
      if (answerText && liveState.active) {
        const plain = answerText
          .replace(/```[\s\S]*?```/g, 'Код отправлен в чат.')
          .replace(/[#*`_]/g, '')
          .trim();
        await speakLiveText(plain.slice(0, 650));
      }
      liveState.isProcessing = false;
      if (liveState.active) updateLiveCallStatus('Говорите...');
    }

    async function speakLiveText(text) {
      if (!text || !liveState.active) return;
      stopCurrentTtsAudio();

      liveState.isSpeaking = true;
      updateLiveCallStatus('Говорит Maf GPT...');
      const orb1 = document.getElementById('liveVoiceOrb');
      const orb2 = document.getElementById('dockedVoiceOrb');
      if (orb1) orb1.classList.add('voice-orb-speaking');
      if (orb2) orb2.classList.add('voice-orb-speaking');

      const finishSpeaking = () => {
        liveState.isSpeaking = false;
        if (orb1) orb1.classList.remove('voice-orb-speaking');
        if (orb2) orb2.classList.remove('voice-orb-speaking');
        if (liveState.active && !liveState.muted) {
          updateLiveCallStatus('Говорите...');
        }
      };

      // 1. Живой мужской голос Gemini TTS (Puck)
      try {
        const { res, data } = await geminiApiRequest('gemini-2.5-flash-preview-tts:generateContent', {
          contents: [
            {
              parts: [{ text: `Произнеси естественно, живо и по-дружески в разговорном темпе: ${text}` }],
            },
          ],
          generationConfig: {
            responseModalities: ['AUDIO'],
            speechConfig: {
              voiceConfig: {
                prebuiltVoiceConfig: { voiceName: 'Puck' },
              },
            },
          },
        });

        const part = data?.candidates?.[0]?.content?.parts?.[0];
        const audioData = part?.inlineData?.data;
        const mimeType = part?.inlineData?.mimeType || '';

        if (res && res.ok && audioData && liveState.active) {
          const rateMatch = mimeType.match(/rate=(\d+)/);
          const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
          const pcmBytes = base64ToUint8Array(audioData);
          const wavBlob = pcmToWavBlob(pcmBytes, sampleRate, 1);
          const audioUrl = URL.createObjectURL(wavBlob);

          await new Promise((resolve) => {
            const audio = new Audio(audioUrl);
            audio.playbackRate = 1.1;
            liveState.currentAudio = audio;
            audio.onended = () => {
              URL.revokeObjectURL(audioUrl);
              liveState.currentAudio = null;
              finishSpeaking();
              resolve();
            };
            audio.onerror = () => {
              URL.revokeObjectURL(audioUrl);
              liveState.currentAudio = null;
              finishSpeaking();
              resolve();
            };
            audio.play().catch(() => {
              URL.revokeObjectURL(audioUrl);
              liveState.currentAudio = null;
              finishSpeaking();
              resolve();
            });
          });
          return;
        }
      } catch (_) {}

      // 2. Резервный встроенный голос браузера
      if ('speechSynthesis' in window && liveState.active) {
        await new Promise((resolve) => {
          try {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ru-RU';
            utter.rate = 1.12;
            utter.pitch = 1.0;
            utter.onend = () => {
              finishSpeaking();
              resolve();
            };
            utter.onerror = () => {
              finishSpeaking();
              resolve();
            };
            window.speechSynthesis.speak(utter);
          } catch (_) {
            finishSpeaking();
            resolve();
          }
        });
      } else {
        finishSpeaking();
      }
    }

    function updateLiveCallStatus(text) {
      const s1 = document.getElementById('liveCallStatus');
      const s2 = document.getElementById('dockedCallStatus');
      if (s1) s1.textContent = text;
      if (s2) s2.textContent = text;
    }

    function updateLiveMuteUI() {
      const on1 = document.getElementById('micOnIcon');
      const off1 = document.getElementById('micOffIcon');
      const on2 = document.getElementById('dockedMicOnIcon');
      const off2 = document.getElementById('dockedMicOffIcon');
      if (liveState.muted) {
        if (on1) on1.classList.add('hidden');
        if (off1) off1.classList.remove('hidden');
        if (on2) on2.classList.add('hidden');
        if (off2) off2.classList.remove('hidden');
        updateLiveCallStatus('Микрофон выключен');
      } else {
        if (off1) off1.classList.add('hidden');
        if (on1) on1.classList.remove('hidden');
        if (off2) off2.classList.add('hidden');
        if (on2) on2.classList.remove('hidden');
        updateLiveCallStatus('Говорите...');
      }
    }

    function toggleLiveMute() {
      liveState.muted = !liveState.muted;
      updateLiveMuteUI();
      if (liveState.muted) {
        liveState.speechStarted = false;
        liveState.pcmBuffers = [];
        liveState.preRollBuffers = [];
        liveState.sttFinalBuffer = '';
        clearTimeout(liveState.sttSilenceTimer);
        if (liveState.recognition) {
          try { liveState.recognition.stop(); } catch (_) {}
        }
      } else if (liveState.recognition && liveState.active) {
        try { liveState.recognition.start(); } catch (_) {}
      }
    }

    function setLiveCallCollapsed(collapsed) {
      liveState.collapsed = collapsed;
      const dockedControls = document.getElementById('dockedCallControls');
      const sendBtn = document.getElementById('sendBtn');

      if (collapsed) {
        showLiveOverlayAnimated(false);
        showDockedBarAnimated(true);
        if (dockedControls) {
          dockedControls.classList.remove('hidden');
          dockedControls.classList.add('flex');
        }
        if (sendBtn) sendBtn.classList.add('hidden');
      } else {
        showDockedBarAnimated(false);
        if (dockedControls) {
          dockedControls.classList.add('hidden');
          dockedControls.classList.remove('flex');
        }
        if (sendBtn) sendBtn.classList.remove('hidden');
        if (liveState.active) {
          showLiveOverlayAnimated(true);
        }
      }
    }

    function stopLiveCall() {
      liveState.active = false;
      liveState.muted = false;
      liveState.collapsed = false;
      liveState.isProcessing = false;
      liveState.speechStarted = false;
      liveState.pcmBuffers = [];
      liveState.preRollBuffers = [];
      liveState.sttFinalBuffer = '';
      clearTimeout(liveState.sttSilenceTimer);

      stopCurrentTtsAudio();

      if (liveState.recognition) {
        try { liveState.recognition.stop(); } catch (_) {}
        liveState.recognition = null;
      }
      if (liveState.vadFrameId) {
        cancelAnimationFrame(liveState.vadFrameId);
        liveState.vadFrameId = null;
      }
      if (liveState.scriptNode) {
        try { liveState.scriptNode.disconnect(); } catch (_) {}
        liveState.scriptNode = null;
      }
      if (liveState.mediaStream) {
        liveState.mediaStream.getTracks().forEach((t) => t.stop());
        liveState.mediaStream = null;
      }
      if (liveState.audioCtx) {
        try { liveState.audioCtx.close(); } catch (_) {}
        liveState.audioCtx = null;
      }
      liveState.analyser = null;

      const dockedControls = document.getElementById('dockedCallControls');
      const sendBtn = document.getElementById('sendBtn');

      showLiveOverlayAnimated(false);
      showDockedBarAnimated(false);
      if (dockedControls) {
        dockedControls.classList.add('hidden');
        dockedControls.classList.remove('flex');
      }
      if (sendBtn) sendBtn.classList.remove('hidden');
      updateActionButtonState();
    }

    function escapePlainError(msg) {
      return String(msg || 'ошибка сети').replace(/[`*]/g, '');
    }

    function initPwaAppMode() {
      try {
        const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0a0a0a"/><path d="M112 376V152L256 280L400 152V376" fill="none" stroke="#60a5fa" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/><circle cx="256" cy="120" r="32" fill="#ffffff"/></svg>`;
        const iconDataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg);
        const touchIcon = document.getElementById('appleTouchIconLink');
        if (touchIcon) touchIcon.href = iconDataUrl;

        const manifest = {
          name: 'Maf GPT',
          short_name: 'Maf GPT',
          start_url: '.',
          display: 'standalone',
          background_color: '#000000',
          theme_color: '#000000',
          icons: [
            {
              src: iconDataUrl,
              sizes: '512x512',
              type: 'image/svg+xml',
              purpose: 'any maskable',
            },
          ],
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        const manifestLink = document.getElementById('pwaManifestLink');
        if (manifestLink) manifestLink.href = URL.createObjectURL(manifestBlob);
      } catch (_) {}
    }

    window.addEventListener('DOMContentLoaded', () => {
      initPwaAppMode();
      loadChats();
      renderSidebarHistory();
      renderChatMessages();
      updateActionButtonState();
    });
  </script>
</body>
</html>
