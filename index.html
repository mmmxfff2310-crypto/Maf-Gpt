<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Maf GPT</title>

  <!-- Настройки полноэкранного режима приложения (PWA) при добавлении на экран «Домой» на iPhone и Android -->
  <meta name="application-name" content="Maf GPT" />
  <meta name="apple-mobile-web-app-title" content="Maf GPT" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <meta name="msapplication-navbutton-color" content="#000000" />
  <link id="appleTouchIconLink" rel="apple-touch-icon" sizes="180x180" href="" />
  <link id="pwaManifestLink" rel="manifest" href="" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            appBg: '#000000',
            sideBg: '#0a0a0a',
            cardBg: '#121212',
            cardHover: '#1c1c1c',
            userBubble: '#1a1a1a',
          },
        },
      },
    };
  </script>
  <style>
    html, body {
      max-width: 100%;
      height: 100%;
      overflow-x: hidden;
      background: #000000;
      color: #ffffff;
      margin: 0;
      padding: 0;
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      min-width: 0;
    }

    /* Учёт вырезов экрана (чёлки и нижней полосы жестов) в полноэкранном режиме приложения */
    .safe-top {
      padding-top: max(0.5rem, env(safe-area-inset-top));
    }
    .safe-bottom {
      padding-bottom: max(1.1rem, calc(env(safe-area-inset-bottom) + 0.65rem));
    }

    /* Поле ввода в стиле современного ChatGPT с тонкой серой обводкой */
    .composer-box {
      background: #212121;
      border: 1px solid #383838;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.65);
      transition: background-color 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .composer-box:focus-within {
      background: #242424;
      border-color: #525252;
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.8);
    }

    /* Все кнопки без обводки и с плавным откликом */
    button {
      border: none !important;
      outline: none !important;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.22s ease, color 0.22s ease, opacity 0.22s ease, box-shadow 0.22s ease;
    }

    /* Плавные анимации переходов между окнами, звонком и чатом */
    .screen-transition {
      transition: opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1), transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }
    .screen-hidden {
      opacity: 0 !important;
      transform: scale(0.95) translateY(14px) !important;
      pointer-events: none !important;
    }
    .screen-visible {
      opacity: 1 !important;
      transform: scale(1) translateY(0) !important;
      pointer-events: auto !important;
    }

    .docked-transition {
      transition: opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1), transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .docked-hidden {
      opacity: 0;
      transform: translateY(14px) scale(0.92);
    }
    .docked-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Анимация живой голосовой сферы во время звонка */
    @keyframes voice-orb-pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 36px rgba(37, 99, 235, 0.45), inset 0 0 26px rgba(255, 255, 255, 0.25);
      }
      50% {
        transform: scale(1.07);
        box-shadow: 0 0 60px rgba(59, 130, 246, 0.75), inset 0 0 36px rgba(255, 255, 255, 0.4);
      }
    }

    .voice-orb-active {
      animation: voice-orb-pulse 2s ease-in-out infinite;
    }

    .voice-orb-speaking {
      animation: voice-orb-pulse 0.8s ease-in-out infinite;
    }

    /* Текстура голубого неба с облаками внутри сферы */
    .sky-orb {
      background:
        radial-gradient(circle at 35% 28%, #93c5fd 0%, #3b82f6 42%, #1d4ed8 72%),
        linear-gradient(180deg, #2563eb 0%, #60a5fa 60%, #eff6ff 100%);
      position: relative;
      overflow: hidden;
    }
    .sky-orb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 88%, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0.45) 36%, transparent 70%);
      pointer-events: none;
    }

    /* Плавная анимация смены стартового заголовка */
    .greeting-fade {
      transition: opacity 0.55s ease, transform 0.55s ease;
    }
    .greeting-hidden {
      opacity: 0;
      transform: translateY(6px);
    }
    .greeting-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Плавное появление сообщений */
    @keyframes msg-slide-up {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .msg-appear {
      animation: msg-slide-up 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Чистая типографика ответов */
    .prose-maf p {
      margin-bottom: 0.85rem;
      line-height: 1.72;
      color: #f5f5f5;
    }
    .prose-maf p:last-child {
      margin-bottom: 0;
    }
    .prose-maf h1, .prose-maf h2, .prose-maf h3 {
      color: #ffffff;
      font-weight: 600;
      margin-top: 1.25rem;
      margin-bottom: 0.55rem;
      line-height: 1.35;
    }
    .prose-maf h1 { font-size: 1.28rem; }
    .prose-maf h2 { font-size: 1.12rem; }
    .prose-maf h3 { font-size: 1.02rem; color: #e5e5e5; }

    .prose-maf ul, .prose-maf ol {
      margin: 0.55rem 0 0.95rem 1.35rem;
      line-height: 1.7;
      color: #f5f5f5;
    }
    .prose-maf ul { list-style-type: disc; }
    .prose-maf ol { list-style-type: decimal; }
    .prose-maf li { margin-bottom: 0.3rem; }

    /* Блоки кода в стиле 2-го фото */
    .code-wrapper {
      margin: 0.95rem 0;
      border-radius: 16px;
      overflow: hidden;
      background: #2f2f2f;
      max-width: 100%;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.15rem;
      background: #2f2f2f;
      font-size: 0.88rem;
      font-weight: 500;
      color: #f5f5f5;
      font-family: 'Inter', sans-serif;
    }

    .code-body {
      margin: 0;
      padding: 0.25rem 1.25rem 1.25rem 1.25rem;
      overflow-x: auto;
      max-width: 100%;
      max-height: 460px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.84rem;
      line-height: 1.65;
      color: #f5f5f5;
      tab-size: 2;
      transition: max-height 0.25s ease;
    }

    .code-body.code-collapsed {
      max-height: 160px;
      overflow-y: hidden;
    }

    .tok-kw { color: #60a5fa; font-weight: 500; }
    .tok-tag { color: #60a5fa; }
    .tok-attr { color: #e5e7eb; }
    .tok-str { color: #86efac; }
    .tok-num { color: #fbbf24; }
    .tok-cmt { color: #8e8e93; font-style: italic; }

    /* Статичная карточка создания изображения без каких-либо анимаций */
    .static-image-placeholder {
      background-color: #141414;
      border: 1px solid #262626;
    }

    textarea#promptInput {
      field-sizing: content;
      max-height: 200px;
      min-height: 26px;
      caret-color: #ffffff;
    }
  </style>
</head>
<body class="bg-appBg text-white antialiased selection:bg-white/25 selection:text-white">
  <div class="flex h-dvh w-full max-w-full overflow-hidden">
    <!-- Затемнение для мобильного меню -->
    <div
      id="sidebarBackdrop"
      onclick="toggleSidebar(false)"
      class="fixed inset-0 z-30 hidden bg-black/80 backdrop-blur-xs transition-opacity duration-200 md:hidden"
    ></div>

    <!-- Боковая панель: на ПК статичная, на мобильном телефоне — выдвижное меню по кнопке с 3 палочками -->
    <aside
      id="sidebar"
      class="safe-top safe-bottom fixed inset-y-0 left-0 z-40 flex w-[280px] max-w-[82vw] shrink-0 -translate-x-full flex-col bg-[#0d0d0d] shadow-2xl transition-transform duration-200 ease-out md:static md:w-64 md:max-w-none md:translate-x-0 md:shadow-none"
    >
      <!-- Верх боковой панели: Новый чат и кнопка закрытия на телефоне -->
      <div class="flex items-center justify-between gap-2 px-3 pt-4 pb-2 md:pt-3.5">
        <button
          id="newChatBtn"
          type="button"
          onclick="createNewChat()"
          class="flex flex-1 items-center gap-2.5 rounded-xl bg-[#1a1a1a] px-3.5 py-2.5 text-sm font-medium text-white hover:bg-[#262626] active:scale-[0.98]"
        >
          <svg class="h-4 w-4 shrink-0 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
          </svg>
          <span>Новый чат</span>
        </button>

        <button
          type="button"
          onclick="toggleSidebar(false)"
          title="Закрыть меню"
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-[#1a1a1a] text-neutral-300 hover:bg-[#262626] hover:text-white active:scale-95 md:hidden"
          aria-label="Закрыть меню"
        >
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Список истории диалогов -->
      <div class="mt-2 flex-1 overflow-y-auto px-2.5 pb-4">
        <div class="px-2.5 py-2 text-[11px] font-medium uppercase tracking-wider text-neutral-500">
          История разговоров
        </div>
        <div id="chatHistoryList" class="flex flex-col gap-1"></div>
      </div>

      <!-- Низ боковой панели -->
      <div class="flex flex-col gap-1 p-2.5">
        <button
          type="button"
          onclick="clearAllChats()"
          class="flex w-full items-center gap-2.5 rounded-xl bg-transparent px-3 py-2 text-xs text-neutral-400 hover:bg-[#1a1a1a] hover:text-white"
        >
          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" />
          </svg>
          <span>Очистить историю</span>
        </button>
      </div>
    </aside>

    <!-- Основная рабочая область -->
    <main class="relative flex min-w-0 flex-1 flex-col overflow-x-hidden bg-appBg">
      <!-- Шапка -->
      <header class="safe-top flex min-h-14 shrink-0 items-center justify-between px-3 sm:px-6">
        <div class="flex items-center gap-2">
          <button
            type="button"
            onclick="toggleSidebar(true)"
            title="История разговоров"
            class="flex h-10 w-10 items-center justify-center rounded-xl bg-transparent text-white hover:bg-[#1a1a1a] active:scale-95 md:hidden"
            aria-label="Открыть меню"
          >
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
              <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>

          <!-- Фирменный значок Maf GPT скраю -->
          <div class="flex select-none items-center gap-2.5">
            <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-xl bg-[#161618] shadow-md">
              <svg class="h-5 w-5" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="mafLogoGrad" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#60a5fa" />
                    <stop offset="55%" stop-color="#2563eb" />
                    <stop offset="100%" stop-color="#ffffff" />
                  </linearGradient>
                </defs>
                <path d="M6.5 23.5V9.5L16 17.5L25.5 9.5V23.5" stroke="url(#mafLogoGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
                <circle cx="16" cy="7.5" r="2.1" fill="#60a5fa" />
              </svg>
            </div>
            <span class="text-base font-semibold tracking-tight text-white">Maf GPT</span>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <!-- Быстрая кнопка нового чата на мобильном телефоне -->
          <button
            type="button"
            onclick="createNewChat()"
            title="Новый чат"
            aria-label="Новый чат"
            class="flex h-9 w-9 items-center justify-center rounded-xl bg-transparent text-neutral-300 hover:bg-[#1a1a1a] hover:text-white active:scale-95 md:hidden"
          >
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
            </svg>
          </button>

          <button
            type="button"
            id="stopGeneratingBtn"
            onclick="stopStreaming()"
            class="hidden items-center gap-1.5 rounded-full bg-[#212121] px-3.5 py-1.5 text-xs font-medium text-white hover:bg-[#2f2f2f]"
          >
            <span class="h-2 w-2 rounded-xs bg-white"></span>
            <span>Остановить</span>
          </button>
        </div>
      </header>

      <!-- Лента сообщений -->
      <div id="messagesScroll" class="flex-1 overflow-y-auto overflow-x-hidden px-3 py-6 sm:px-6">
        <div id="messagesInner" class="mx-auto flex w-full max-w-[820px] min-w-0 flex-col gap-6 overflow-x-hidden pb-4">
          <!-- Контент чата -->
        </div>
      </div>

      <!-- Всплывающее уведомление -->
      <div
        id="toastBanner"
        class="pointer-events-none fixed bottom-28 left-1/2 z-50 -translate-x-1/2 rounded-full bg-[#262626] px-4 py-2 text-xs font-medium text-white opacity-0 shadow-xl transition-all duration-200"
      >
        Готово
      </div>

      <!-- Компактная голосовая сфера прямо над полем ввода (когда звонок свёрнут вниз) -->
      <div
        id="dockedCallBar"
        class="docked-transition docked-hidden mx-auto hidden w-full max-w-[820px] shrink-0 flex-col items-center justify-center overflow-x-hidden bg-appBg px-3 pt-2 pb-1"
      >
        <button
          type="button"
          onclick="setLiveCallCollapsed(false)"
          title="Развернуть звонок"
          class="group relative flex flex-col items-center gap-1.5 bg-transparent"
        >
          <div
            id="dockedVoiceOrb"
            class="sky-orb voice-orb-active h-20 w-20 rounded-full shadow-2xl transition-transform duration-200 group-hover:scale-105"
          ></div>
          <span id="dockedCallStatus" class="text-[11px] font-medium text-neutral-400">Говорите...</span>
        </button>
      </div>

      <!-- Область ввода -->
      <div class="safe-bottom shrink-0 overflow-x-hidden bg-appBg px-3 pt-1 sm:px-6 sm:pb-7">
        <div class="mx-auto w-full max-w-[820px] min-w-0">
          <!-- Превью прикреплённого фото -->
          <div id="imagePreviewContainer" class="mb-2.5 hidden">
            <div class="relative inline-flex items-center gap-3 rounded-2xl bg-[#212121] p-2 pr-3 shadow-lg">
              <img
                id="imagePreviewThumb"
                src=""
                alt="Фото"
                class="h-14 w-14 rounded-xl object-cover"
              />
              <div class="min-w-0">
                <div id="imagePreviewName" class="max-w-[180px] truncate text-xs font-medium text-white">
                  photo.jpg
                </div>
                <div class="text-[11px] text-neutral-400">Фото прикреплено</div>
              </div>
              <button
                type="button"
                onclick="clearAttachedImage()"
                aria-label="Удалить фото"
                class="flex h-7 w-7 items-center justify-center rounded-full bg-[#2e2e2e] text-white hover:bg-[#3a3a3a]"
              >
                <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M18 6L6 18M6 6l12 12" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Капсула ввода -->
          <div class="composer-box flex items-end gap-2 rounded-[28px] px-3 py-2">
            <input
              type="file"
              id="imageFileInput"
              accept="image/*"
              class="hidden"
              onchange="handleImageSelected(event)"
            />

            <!-- Значок + для прикрепления фото -->
            <button
              type="button"
              onclick="document.getElementById('imageFileInput').click()"
              title="Прикрепить фото"
              aria-label="Прикрепить фото"
              class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-transparent text-neutral-300 hover:bg-[#2f2f2f] hover:text-white active:scale-95"
            >
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
                <path d="M12 5v14M5 12h14" />
              </svg>
            </button>

            <textarea
              id="promptInput"
              rows="1"
              placeholder="Спросить Maf GPT"
              oninput="updateActionButtonState()"
              onkeydown="handleComposerKeydown(event)"
              onpaste="handleComposerPaste(event)"
              class="my-auto max-h-48 min-h-[24px] flex-1 resize-none bg-transparent py-1.5 text-[15px] leading-relaxed text-white placeholder-neutral-400 focus:outline-none focus:ring-0"
            ></textarea>

            <!-- Кнопки во время активного звонка -->
            <div id="dockedCallControls" class="hidden shrink-0 items-center gap-2">
              <button
                type="button"
                id="dockedMuteBtn"
                onclick="toggleLiveMute()"
                title="Выключить / включить микрофон"
                aria-label="Микрофон"
                class="flex h-9 w-9 items-center justify-center rounded-full bg-[#2c2c2c] text-white hover:bg-[#3a3a3a] active:scale-95"
              >
                <svg id="dockedMicOnIcon" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                  <line x1="12" y1="19" x2="12" y2="22" />
                </svg>
                <svg id="dockedMicOffIcon" class="hidden h-4 w-4 text-neutral-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="2" y1="2" x2="22" y2="22" />
                  <path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2" />
                  <path d="M5 10v2a7 7 0 0 0 12 5" />
                  <path d="M15 9.34V5a3 3 0 0 0-5.68-1.33" />
                  <path d="M9 9v3a3 3 0 0 0 5.12 2.12" />
                  <line x1="12" y1="19" x2="12" y2="22" />
                </svg>
              </button>

              <button
                type="button"
                onclick="stopLiveCall()"
                title="Закончить разговор"
                aria-label="Закончить разговор"
                class="flex h-9 w-9 items-center justify-center rounded-full bg-[#2563eb] text-white hover:bg-[#1d4ed8] active:scale-95"
              >
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 6L6 18M6 6l12 12" />
                </svg>
              </button>
            </div>

            <!-- Умная кнопка в обычном режиме: если пусто — синяя кнопка живого звонка; если введён текст — белая стрелка вверх для отправки -->
            <button
              type="button"
              id="sendBtn"
              onclick="handlePrimaryActionClick()"
              title="Голосовой разговор"
              aria-label="Голосовой разговор"
              class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-[#2563eb] text-white hover:bg-[#1d4ed8] active:scale-95 disabled:cursor-not-allowed disabled:opacity-45"
            >
              <!-- Иконка звуковых волн -->
              <svg id="iconVoiceWave" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <path d="M5 10v4" />

  <!-- Полноэкранный режим живого голосового звонка с плавной анимацией -->

    <!-- Нижняя панель управления звонком -->
    <div class="flex items-center gap-6">
      <button

      >
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

  <!-- Модальное окно переименования чата -->
  <div
    id="renameModal"
    class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 p-4 backdrop-blur-xs"
  >
    <div class="w-full max-w-sm rounded-2xl bg-[#1c1c1c] p-5 shadow-2xl">
      <h3 class="mb-3 text-sm font-semibold text-white">Переименовать чат</h3>
      <input
        type="text"
        id="renameChatInput"

      <div class="mt-4 flex justify-end gap-2">

          Отмена
        </button>
        <button
          type="button"
          onclick="confirmRenameChat()"
          class="rounded-xl bg-[#2563eb] px-4 py-1.5 text-xs font-medium text-white hover:bg-[#1d4ed8]"

          Сохранить
        </button>

  <!-- Модальное окно живого предпросмотра HTML-кода -->
  <div
    id="codePreviewModal"
    class="fixed inset-0 z-50 hidden flex-col bg-black/90 p-3 backdrop-blur-xs sm:p-6"
  >
    <div class="mx-auto flex h-full w-full max-w-5xl flex-col overflow-hidden rounded-2xl bg-[#18181a] shadow-2xl">
      <div class="flex items-center justify-between bg-[#212121] px-4 py-3">
        <span class="text-xs font-semibold text-white">Предпросмотр кода</span>
        <button
          type="button"
          onclick="closeCodePreviewModal()"
          class="flex h-8 w-8 items-center justify-center rounded-lg bg-[#2f2f2f] text-white hover:bg-[#3e3e3e]"
          aria-label="Закрыть предпросмотр"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
      <iframe
        id="codePreviewFrame"
        sandbox="allow-scripts allow-forms allow-modals"
        class="h-full w-full flex-1 bg-white"
      ></iframe>
    </div>
  </div>

  <script>
    /**
     * Maf GPT — Состояние приложения и постоянное хранилище
     */
    const STORAGE_KEYS = {
      CHATS: 'maf_gpt_chats_bw_v1',
      ACTIVE_CHAT: 'maf_gpt_active_chat_bw_v1',
      CUSTOM_KEY: 'maf_gpt_custom_api_key_v1',
    };

    const state = {
      chats: [],
      activeChatId: null,
      isGenerating: false,
      abortController: null,
      attachedImage: null,
      greetingTimer: null,
      renamingChatId: null,
    };

    const codeStore = {};
    let codeBlockCounter = 0;
    const EMBEDDED_API_KEY = '';

    function getEffectiveApiKey() {
      try {
        const saved = localStorage.getItem(STORAGE_KEYS.CUSTOM_KEY);
        if (saved && saved.trim()) return saved.trim();
      } catch (_) {}
      return EMBEDDED_API_KEY.trim();
    }

    async function saveCustomApiKeyFromInline(inputId) {
      const el = document.getElementById(inputId);
      const val = el ? el.value.trim() : '';
      if (!val) {
        showToast('Вставьте API-ключ из Google AI Studio');
        return;
      }
      try {
        localStorage.setItem(STORAGE_KEYS.CUSTOM_KEY, val);
      } catch (_) {}
      showToast('Ключ сохранён, повторяю запрос...');

      const chat = getActiveChat();
      if (chat && chat.messages.length >= 2) {
        const lastModel = chat.messages[chat.messages.length - 1];
        const lastUser = chat.messages[chat.messages.length - 2];
        if (lastModel && lastModel.role === 'model' && lastModel.isKeyError && lastUser && lastUser.role === 'user') {
          chat.messages.splice(chat.messages.length - 2, 2);
          saveChats();
          renderChatMessages();
          await sendMessage(lastUser.text || '');
        }
      }
    }

    function buildGeminiHeaders(apiKey) {
      const headers = { 'Content-Type': 'application/json' };
      if (apiKey) {
        headers['x-goog-api-key'] = apiKey;
      }
      return headers;
    }

    /**
     * Единый запрос к Gemini API с поддержкой ключей AIza... и AQ....
     */
    async function geminiApiRequest(modelPath, bodyObj, signal) {
      const apiKey = getEffectiveApiKey();
      const endpoints = [
        {
          url: `https://generativelanguage.googleapis.com/v1beta/models/${modelPath}?key=${encodeURIComponent(apiKey)}`,
          headers: { 'Content-Type': 'application/json' },
        },
        {
          url: `https://generativelanguage.googleapis.com/v1beta/models/${modelPath}`,
          headers: buildGeminiHeaders(apiKey),
        },
        {
          url: `https://aiplatform.googleapis.com/v1beta1/publishers/google/models/${modelPath}`,
          headers: buildGeminiHeaders(apiKey),
        },
      ];

      let lastRes = null;
      let lastData = {};

      for (const ep of endpoints) {
        const res = await fetch(ep.url, {
          method: 'POST',
          headers: ep.headers,
          signal,
          body: JSON.stringify(bodyObj),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          return { res, data };
        }
        lastRes = res;
        lastData = data;
        const errMsg = data?.error?.message || '';
        if (!/api key|not valid|permission|unauthenticated|unsupported|400|401|403/i.test(errMsg + ' ' + res.status)) {
          break;
        }
      }

      return { res: lastRes, data: lastData };
    }

    function loadChats() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.CHATS);
        const parsed = raw ? JSON.parse(raw) : [];
        state.chats = Array.isArray(parsed) ? parsed : [];
      } catch (_) {
        state.chats = [];
      }
      state.activeChatId = localStorage.getItem(STORAGE_KEYS.ACTIVE_CHAT) || null;
    }

    function saveChats() {
      try {
        localStorage.setItem(STORAGE_KEYS.CHATS, JSON.stringify(state.chats));
        if (state.activeChatId) {
          localStorage.setItem(STORAGE_KEYS.ACTIVE_CHAT, state.activeChatId);
        } else {
          localStorage.removeItem(STORAGE_KEYS.ACTIVE_CHAT);
        }
      } catch (_) {
        if (state.chats.length > 1) {
          state.chats = state.chats.slice(0, 8);
          try {
            localStorage.setItem(STORAGE_KEYS.CHATS, JSON.stringify(state.chats));
          } catch (_) {}
        }
      }
    }

    function getActiveChat() {
      return state.chats.find((c) => c.id === state.activeChatId) || null;
    }

    function ensureActiveChat() {
      let chat = getActiveChat();
      if (!chat) {
        chat = {
          id: 'chat_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          title: 'Новый чат',
          messages: [],
          updatedAt: Date.now(),
        };
        state.chats.unshift(chat);
        state.activeChatId = chat.id;
        saveChats();
        renderSidebarHistory();
      }
      return chat;
    }

    function createNewChat() {
      if (state.isGenerating) stopStreaming();
      state.activeChatId = null;
      saveChats();
      renderSidebarHistory();
      renderChatMessages();
      toggleSidebar(false);
      const input = document.getElementById('promptInput');
      if (input) input.focus();
    }

    function selectChat(chatId) {
      if (state.isGenerating) stopStreaming();
      state.activeChatId = chatId;
      saveChats();
      renderSidebarHistory();
      renderChatMessages();
      toggleSidebar(false);
    }

    function deleteChat(event, chatId) {
      event.stopPropagation();
      state.chats = state.chats.filter((c) => c.id !== chatId);
      if (state.activeChatId === chatId) {
        state.activeChatId = state.chats.length ? state.chats[0].id : null;
      }
      saveChats();
      renderSidebarHistory();
      renderChatMessages();
    }

    function clearAllChats() {
      state.chats = [];
      state.activeChatId = null;
      saveChats();
      renderSidebarHistory();
      renderChatMessages();
      showToast('История очищена');
    }

    function openRenameModal(event, chatId) {
      event.stopPropagation();
      const chat = state.chats.find((c) => c.id === chatId);
      if (!chat) return;
      state.renamingChatId = chatId;
      const modal = document.getElementById('renameModal');
      const input = document.getElementById('renameChatInput');
      if (input) input.value = chat.title;
      if (modal) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        setTimeout(() => {
          if (input) {
            input.focus();
            input.select();
          }
        }, 40);
      }
    }

    function closeRenameModal() {
      state.renamingChatId = null;
      const modal = document.getElementById('renameModal');
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    function confirmRenameChat() {
      const input = document.getElementById('renameChatInput');
      const newTitle = (input ? input.value : '').trim();
      if (newTitle && state.renamingChatId) {
        const chat = state.chats.find((c) => c.id === state.renamingChatId);
        if (chat) {
          chat.title = newTitle;
          saveChats();
          renderSidebarHistory();
        }
      }
      closeRenameModal();
    }

    function toggleSidebar(forceOpen) {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebarBackdrop');
      if (!sidebar || !backdrop) return;
      const isCurrentlyClosed = sidebar.classList.contains('-translate-x-full');
      const shouldOpen = typeof forceOpen === 'boolean' ? forceOpen : isCurrentlyClosed;
      if (shouldOpen) {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      }
    }

    function showToast(text) {
      const el = document.getElementById('toastBanner');
      if (!el) return;
      el.textContent = text;
      el.classList.remove('opacity-0');
      el.classList.add('opacity-100');
      clearTimeout(el._timer);
      el._timer = setTimeout(() => {
        el.classList.remove('opacity-100');
        el.classList.add('opacity-0');
      }, 2000);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderSidebarHistory() {
      const list = document.getElementById('chatHistoryList');
      if (!list) return;
      if (!state.chats.length) {
        list.innerHTML = `<div class="px-3 py-4 text-xs text-neutral-600">Пока нет сохранённых диалогов</div>`;
        return;
      }

      list.innerHTML = state.chats
        .map((chat) => {
          const active = chat.id === state.activeChatId;
          return `
            <div
              onclick="selectChat('${chat.id}')"
              class="group flex cursor-pointer items-center justify-between gap-2 rounded-xl px-3 py-2 text-xs transition ${
                active ? 'bg-[#1f1f1f] text-white font-medium' : 'text-neutral-400 hover:bg-[#161616] hover:text-white'
              }"
            >
              <span class="truncate">${escapeHtml(chat.title || 'Новый чат')}</span>
              <div class="flex shrink-0 items-center gap-0.5 opacity-0 transition group-hover:opacity-100">
                <button
                  type="button"
                  onclick="openRenameModal(event, '${chat.id}')"
                  title="Переименовать"
                  class="flex h-6 w-6 items-center justify-center rounded-md text-neutral-400 hover:bg-[#2a2a2a] hover:text-white"
                >
                  <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 20h9" />
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                  </svg>
                </button>
                <button
                  type="button"
                  onclick="deleteChat(event, '${chat.id}')"
                  title="Удалить"
                  class="flex h-6 w-6 items-center justify-center rounded-md text-neutral-400 hover:bg-[#2a2a2a] hover:text-white"
                >
                  <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12" />
                  </svg>
                </button>
              </div>
            </div>
          `;
        })
        .join('');
    }

    function startGreetingAnimation() {
      if (state.greetingTimer) {
        clearInterval(state.greetingTimer);
        state.greetingTimer = null;
      }
      const phrases = [
        'Чем помочь сегодня?',
        'Можем начинать.',
        'Какая идея у нас на очереди?',
        'Готов к любым задачам.',
        'Спросите о чём угодно.',
        'Создадим что-то крутое?',
      ];
      let idx = 0;
      state.greetingTimer = setInterval(() => {
        const el = document.getElementById('welcomeGreeting');
        if (!el) {
          clearInterval(state.greetingTimer);
          state.greetingTimer = null;
          return;
        }
        el.classList.remove('greeting-visible');
        el.classList.add('greeting-hidden');
        setTimeout(() => {
          const target = document.getElementById('welcomeGreeting');
          if (!target) return;
          idx = (idx + 1) % phrases.length;
          target.textContent = phrases[idx];
          target.classList.remove('greeting-hidden');
          target.classList.add('greeting-visible');
        }, 420);
      }, 3600);
    }

    function renderChatMessages() {
      const container = document.getElementById('messagesInner');
      if (!container) return;

      const chat = getActiveChat();
      if (!chat || !chat.messages.length) {
        container.innerHTML = `
          <div class="flex min-h-[62vh] flex-col items-center justify-center px-4 text-center">
            <div class="mb-5 flex h-14 w-14 items-center justify-center rounded-2xl bg-[#141416] shadow-xl">
              <svg class="h-8 w-8" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="mafHeroGrad" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#60a5fa" />
                    <stop offset="55%" stop-color="#2563eb" />
                    <stop offset="100%" stop-color="#ffffff" />
                  </linearGradient>
                </defs>
                <path d="M6.5 23.5V9.5L16 17.5L25.5 9.5V23.5" stroke="url(#mafHeroGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
                <circle cx="16" cy="7.5" r="2.1" fill="#60a5fa" />
              </svg>
            </div>
            <h1 id="welcomeGreeting" class="greeting-fade greeting-visible text-2xl font-semibold tracking-tight text-white sm:text-3xl">
              Чем помочь сегодня?
            </h1>
          </div>
        `;
        startGreetingAnimation();
        return;
      }

      if (state.greetingTimer) {
        clearInterval(state.greetingTimer);
        state.greetingTimer = null;
      }

      container.innerHTML = chat.messages
        .map((msg, index) => buildMessageHTML(msg, index))
        .join('');

      scrollToBottom();
    }

    function buildMessageHTML(msg, index) {
      if (msg.role === 'user') {
        const imgHtml = msg.imageDataUrl
          ? `<img src="${msg.imageDataUrl}" alt="Фото" class="mb-2 max-h-64 rounded-2xl object-contain" />`
          : '';
        const textHtml = msg.text
          ? `<div class="whitespace-pre-wrap break-words text-[15px] leading-relaxed text-white">${escapeHtml(msg.text)}</div>`
          : '';

        return `
          <div class="msg-appear flex flex-col items-end">
            <div class="max-w-[85%] rounded-3xl bg-[#1f1f1f] px-4 py-3 sm:max-w-[75%]">
              ${imgHtml}
              ${textHtml}
            </div>
            <div class="mt-1.5 flex items-center gap-1 pr-1">
              <button
                type="button"
                onclick="copyMessageText(${index})"
                title="Копировать"
                class="flex h-7 w-7 items-center justify-center rounded-lg bg-transparent text-neutral-400 hover:bg-[#1a1a1a] hover:text-white"
              >
                <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
                  <rect x="9" y="9" width="13" height="13" rx="2" />
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                </svg>
              </button>
              <button
                type="button"
                onclick="editUserMessage(${index})"
                title="Редактировать"
                class="flex h-7 w-7 items-center justify-center rounded-lg bg-transparent text-neutral-400 hover:bg-[#1a1a1a] hover:text-white"
              >
                <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
                  <path d="M12 20h9" />
                  <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                </svg>
              </button>
            </div>
          </div>
        `;
      }

      if (msg.isImagePending) {
        return `
          <div class="msg-appear flex flex-col items-start">
            <div class="mb-2 text-sm font-medium text-neutral-300">Создание изображения</div>
            <div class="static-image-placeholder flex h-72 w-72 max-w-full items-center justify-center rounded-2xl">
              <span class="text-xs text-neutral-500">Пожалуйста, подождите...</span>
            </div>
          </div>
        `;
      }

      const generatedImgHtml = msg.generatedImageUrl
        ? `
          <div class="mb-3 overflow-hidden rounded-2xl bg-[#121212]">
            <img src="${msg.generatedImageUrl}" alt="Сгенерированное фото" class="max-h-[460px] w-auto max-w-full rounded-2xl object-contain" />
          </div>
        `
        : '';

      const renderedBody = msg.text
        ? `<div class="prose-maf w-full max-w-full break-words text-[15px]">${renderRichMarkdown(msg.text)}</div>`
        : msg.isStreaming
        ? `<div class="text-[15px] font-medium text-neutral-400">Думаю над ответом...</div>`
        : '';

      const keyRecoveryHtml = msg.isKeyError
        ? `
          <div class="mt-3 flex w-full max-w-md flex-col gap-2.5 rounded-2xl bg-[#161618] p-4">
            <div class="text-xs leading-relaxed text-neutral-300">
              Старый ключ недействителен или был отозван. Создайте бесплатный ключ вида <span class="font-mono text-white">AIzaSy...</span> в <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" class="underline text-blue-400">Google AI Studio</a>, вставьте его ниже и нажмите <span class="font-medium text-white">Сохранить</span>:
            </div>
            <div class="flex items-center gap-2">
              <input
                id="inlineKeyInput_${index}"

                placeholder="AIzaSy..."

              />

                class="shrink-0 rounded-xl bg-[#2563eb] px-3.5 py-2 text-xs font-medium text-white hover:bg-[#1d4ed8]"
              >
                Сохранить
              </button>
            </div>
          </div>
        `
        : '';

      const feedback = msg.feedback || null;
      const actionBarHtml = !msg.isStreaming
        ? `
          <div class="mt-2 flex items-center gap-1">
            <button
              type="button"
              onclick="copyMessageText(${index})"
              title="Копировать"
              class="flex h-8 w-8 items-center justify-center rounded-lg bg-transparent text-neutral-400 hover:bg-[#1a1a1a] hover:text-white"
            >
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
                <rect x="9" y="9" width="13" height="13" rx="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
              </svg>
            </button>
            <button
              type="button"
              onclick="toggleMessageFeedback(${index}, 'like')"
              title="Нравится"
              class="flex h-8 w-8 items-center justify-center rounded-lg bg-transparent hover:bg-[#1a1a1a] ${
                feedback === 'like' ? 'text-white' : 'text-neutral-400 hover:text-white'
              }"
            >
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="${feedback === 'like' ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.9">
                <path d="M7 10v12" />
                <path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z" />
              </svg>
            </button>
            <button
              type="button"
              onclick="toggleMessageFeedback(${index}, 'dislike')"
              title="Не нравится"
              class="flex h-8 w-8 items-center justify-center rounded-lg bg-transparent hover:bg-[#1a1a1a] ${
                feedback === 'dislike' ? 'text-white' : 'text-neutral-400 hover:text-white'
              }"
            >
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="${feedback === 'dislike' ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.9">
                <path d="M17 14V2" />
                <path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z" />
              </svg>
            </button>
            <button
              type="button"
              onclick="shareOrDownloadMessage(${index})"
              title="${msg.generatedImageUrl ? 'Скачать в галерею' : 'Поделиться'}"
              class="flex h-8 w-8 items-center justify-center rounded-lg bg-transparent text-neutral-400 hover:bg-[#1a1a1a] hover:text-white"
            >
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" />

      return `
        <div class="msg-appear flex w-full max-w-full flex-col items-start">
          ${generatedImgHtml}
          ${renderedBody}
          ${keyRecoveryHtml}
          ${actionBarHtml}
        </div>
