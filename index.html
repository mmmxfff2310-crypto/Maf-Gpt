<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Maf GPT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            appBg: '#000000',
            sideBg: '#0a0a0a',
            cardBg: '#121212',
            cardHover: '#1c1c1c',
            userBubble: '#1a1a1a',
          },
        },
      },
    };
  </script>
  <style>
    html, body {
      max-width: 100%;
      overflow-x: hidden;
      background: #000000;
      color: #ffffff;
      margin: 0;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      min-width: 0;
    }

    /* Полупрозрачное тёмное поле ввода в стиле современного ChatGPT с тонкой серой обводкой как на фото */
    .composer-box {
      background: #212121;
      border: 1px solid #383838;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.65);
      transition: background-color 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .composer-box:focus-within {
      background: #242424;
      border-color: #525252;
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.8);
    }

    /* Все кнопки без обводки */
    button {
      border: none !important;
      outline: none !important;
    }

    /* Анимация живой голосовой сферы во время звонка */
    @keyframes voice-orb-pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 36px rgba(37, 99, 235, 0.45), inset 0 0 26px rgba(255, 255, 255, 0.25);
      }
      50% {
        transform: scale(1.07);
        box-shadow: 0 0 60px rgba(59, 130, 246, 0.75), inset 0 0 36px rgba(255, 255, 255, 0.4);
      }
    }

    .voice-orb-active {
      animation: voice-orb-pulse 2s ease-in-out infinite;
    }

    .voice-orb-speaking {
      animation: voice-orb-pulse 0.8s ease-in-out infinite;
    }

    /* Текстура голубого неба с облаками внутри сферы как на фото */
    .sky-orb {
      background:
        radial-gradient(circle at 35% 28%, #93c5fd 0%, #3b82f6 42%, #1d4ed8 72%),
        linear-gradient(180deg, #2563eb 0%, #60a5fa 60%, #eff6ff 100%);
      position: relative;
      overflow: hidden;
    }
    .sky-orb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 88%, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0.45) 36%, transparent 70%);
      pointer-events: none;
    }

    /* Плавная анимация смены стартового заголовка */
    .greeting-fade {
      transition: opacity 0.55s ease, transform 0.55s ease;
    }
    .greeting-hidden {
      opacity: 0;
      transform: translateY(6px);
    }
    .greeting-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Плавное появление сообщений */
    @keyframes msg-slide-up {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .msg-appear {
      animation: msg-slide-up 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Белый мигающий курсор печати */
    .streaming-cursor::after {
      content: '▍';
      display: inline-block;
      margin-left: 3px;
      color: #ffffff;
      animation: cursor-blink 0.8s steps(2, start) infinite;
    }
    @keyframes cursor-blink {
      to { visibility: hidden; }
    }

    /* Чистая типографика ответов */
    .prose-maf p {
      margin-bottom: 0.85rem;
      line-height: 1.72;
      color: #f5f5f5;
    }
    .prose-maf p:last-child {
      margin-bottom: 0;
    }
    .prose-maf h1, .prose-maf h2, .prose-maf h3 {
      color: #ffffff;
      font-weight: 600;
      margin-top: 1.25rem;
      margin-bottom: 0.55rem;
      line-height: 1.35;
    }
    .prose-maf h1 { font-size: 1.28rem; }
    .prose-maf h2 { font-size: 1.12rem; }
    .prose-maf h3 { font-size: 1.02rem; color: #e5e5e5; }

    .prose-maf ul, .prose-maf ol {
      margin: 0.55rem 0 0.95rem 1.35rem;
      line-height: 1.7;
      color: #f5f5f5;
    }

    /* Блоки кода в стиле 2-го фото */
    .code-wrapper {
      margin: 0.95rem 0;
      border-radius: 16px;
      overflow: hidden;
      background: #2f2f2f;
      max-width: 100%;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.15rem;
      background: #2f2f2f;
      font-size: 0.88rem;
      font-weight: 500;
      color: #f5f5f5;
      font-family: 'Inter', sans-serif;
    }

    .code-body {
      margin: 0;
      padding: 0.25rem 1.25rem 1.25rem 1.25rem;
      overflow-x: auto;
      max-width: 100%;
      max-height: 460px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.84rem;
      line-height: 1.65;
      color: #f5f5f5;
      tab-size: 2;
      transition: max-height 0.25s ease;
    }

    .code-body.code-collapsed {
      max-height: 160px;
      overflow-y: hidden;
    }

    .tok-kw { color: #60a5fa; font-weight: 500; }
    .tok-tag { color: #60a5fa; }
    .tok-attr { color: #e5e7eb; }
    .tok-str { color: #86efac; }
    .tok-num { color: #fbbf24; }
    .tok-cmt { color: #8e8e93; font-style: italic; }

    /* Статичная карточка создания изображения без каких-либо анимаций */
    .static-image-placeholder {
      background-color: #141414;
      border: 1px solid #262626;
    }

    textarea#promptInput {
      field-sizing: content;
      max-height: 200px;
      min-height: 26px;
      caret-color: #ffffff;
    }
  </style>
</head>
<body class="bg-appBg text-white antialiased selection:bg-white/25 selection:text-white">
  <div class="flex h-dvh w-full max-w-full overflow-hidden">
    <!-- Затемнение для мобильного меню -->
    <div
      id="sidebarBackdrop"
      onclick="toggleSidebar(false)"
      class="fixed inset-0 z-30 hidden bg-black/80 backdrop-blur-xs transition-opacity duration-200 md:hidden"
    ></div>

    <!-- Боковая панель: на ПК статичная, на мобильном телефоне — выдвижное меню по кнопке с 3 палочками с кнопкой закрытия -->
    <aside
      id="sidebar"
      class="fixed inset-y-0 left-0 z-40 flex w-[280px] max-w-[82vw] shrink-0 -translate-x-full flex-col bg-[#0d0d0d] shadow-2xl transition-transform duration-200 ease-out md:static md:w-64 md:max-w-none md:translate-x-0 md:shadow-none"
    >
      <!-- Верх боковой панели: Новый чат и кнопка закрытия на телефоне -->
      <div class="flex items-center justify-between gap-2 px-3 pt-4 pb-2 md:pt-3.5">
        <button
          id="newChatBtn"
          onclick="createNewChat()"
          class="flex flex-1 items-center gap-2.5 rounded-xl bg-[#1a1a1a] px-3.5 py-2.5 text-sm font-medium text-white transition hover:bg-[#262626] active:scale-[0.99]"
        >
          <svg class="h-4 w-4 shrink-0 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
          </svg>
          <span>Новый чат</span>
        </button>

        <button
          type="button"
          onclick="toggleSidebar(false)"
          title="Закрыть меню"
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-[#1a1a1a] text-neutral-300 transition hover:bg-[#262626] hover:text-white active:scale-95 md:hidden"
          aria-label="Закрыть меню"
        >
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Список истории диалогов -->
      <div class="mt-2 flex-1 overflow-y-auto px-2.5 pb-4">
        <div class="px-2.5 py-2 text-[11px] font-medium uppercase tracking-wider text-neutral-500">
          История разговоров
        </div>
        <div id="chatHistoryList" class="flex flex-col gap-1"></div>
      </div>

      <!-- Низ боковой панели: очистка истории -->
      <div class="p-2.5">
        <button
          type="button"
          onclick="clearAllChats()"
          class="flex w-full items-center gap-2.5 rounded-xl bg-transparent px-3 py-2.5 text-xs text-neutral-400 transition hover:bg-[#1a1a1a] hover:text-white"
        >
          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" />
          </svg>
          <span>Очистить историю</span>
        </button>
      </div>
    </aside>

    <!-- Основная рабочая область -->
    <main class="relative flex min-w-0 flex-1 flex-col overflow-x-hidden bg-appBg">
      <!-- Шапка: на мобильном скраю 3 палочки + логотип + быстрый новый чат; на ПК всё как и было -->
      <header class="flex h-14 shrink-0 items-center justify-between px-3 sm:px-6">
        <div class="flex items-center gap-2">
          <button
            type="button"
            onclick="toggleSidebar(true)"
            title="История разговоров"
            class="flex h-10 w-10 items-center justify-center rounded-xl bg-transparent text-white transition hover:bg-[#1a1a1a] active:scale-95 md:hidden"
            aria-label="Открыть меню"
          >
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
              <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>

          <!-- Фирменный значок Maf GPT скраю -->
          <div class="flex items-center gap-2.5 select-none">
            <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-xl bg-[#161618] shadow-md">
              <svg class="h-5 w-5" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="mafLogoGrad" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#60a5fa" />
                    <stop offset="55%" stop-color="#2563eb" />
                    <stop offset="100%" stop-color="#ffffff" />
                  </linearGradient>
                </defs>
                <!-- Геометрическая монограмма M + нейронная искра -->
                <path d="M6.5 23.5V9.5L16 17.5L25.5 9.5V23.5" stroke="url(#mafLogoGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
                <circle cx="16" cy="7.5" r="2.1" fill="#60a5fa" />
              </svg>
            </div>
            <span class="text-base font-semibold tracking-tight text-white">Maf GPT</span>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <!-- Быстрая кнопка нового чата на мобильном телефоне -->
          <button
            type="button"
            onclick="createNewChat()"
            title="Новый чат"
            aria-label="Новый чат"
            class="flex h-9 w-9 items-center justify-center rounded-xl bg-transparent text-neutral-300 transition hover:bg-[#1a1a1a] hover:text-white active:scale-95 md:hidden"
          >
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
            </svg>
          </button>

          <button
            type="button"
            id="stopGeneratingBtn"
            onclick="stopStreaming()"
            class="hidden items-center gap-1.5 rounded-full bg-[#212121] px-3.5 py-1.5 text-xs font-medium text-white transition hover:bg-[#2f2f2f]"
          >
            <span class="h-2 w-2 rounded-xs bg-white"></span>
            <span>Остановить</span>
          </button>
        </div>
      </header>

      <!-- Лента сообщений (всегда видна, в том числе над свёрнутым звонком) -->
      <div id="messagesScroll" class="flex-1 overflow-y-auto overflow-x-hidden px-3 py-6 sm:px-6">
        <div id="messagesInner" class="mx-auto flex w-full max-w-[820px] min-w-0 flex-col gap-6 overflow-x-hidden pb-4">
          <!-- Контент чата -->
        </div>
      </div>

      <!-- Всплывающее уведомление -->
      <div
        id="toastBanner"
        class="pointer-events-none fixed bottom-28 left-1/2 z-50 -translate-x-1/2 rounded-full bg-[#262626] px-4 py-2 text-xs font-medium text-white opacity-0 shadow-xl transition-all duration-200"
      >
        Готово
      </div>

      <!-- Компактная голосовая сфера прямо над полем ввода (когда звонок свёрнут вниз как на фото) -->
      <div
        id="dockedCallBar"
        class="mx-auto hidden w-full max-w-[820px] shrink-0 flex-col items-center justify-center overflow-x-hidden bg-appBg px-3 pt-2 pb-1"
      >
        <button
          type="button"
          onclick="setLiveCallCollapsed(false)"
          title="Развернуть звонок"
          class="group relative flex flex-col items-center gap-1.5 bg-transparent"
        >
          <div
            id="dockedVoiceOrb"
            class="sky-orb voice-orb-active h-20 w-20 rounded-full shadow-2xl transition-transform duration-200 group-hover:scale-105"
          ></div>
          <span id="dockedCallStatus" class="text-[11px] font-medium text-neutral-400">Говорите...</span>
        </button>
      </div>

      <!-- Область ввода -->
      <div class="shrink-0 overflow-x-hidden bg-appBg px-3 pb-5 pt-1 sm:px-6 sm:pb-7">
        <div class="mx-auto w-full max-w-[820px] min-w-0">
          <!-- Превью прикреплённого фото -->
          <div id="imagePreviewContainer" class="mb-2.5 hidden">
            <div class="relative inline-flex items-center gap-3 rounded-2xl bg-[#212121] p-2 pr-3 shadow-lg">
              <img
                id="imagePreviewThumb"
                src=""
                alt="Фото"
                class="h-14 w-14 rounded-xl object-cover"
              />
              <div class="min-w-0">
                <div id="imagePreviewName" class="max-w-[180px] truncate text-xs font-medium text-white">
                  photo.jpg
                </div>
                <div class="text-[11px] text-neutral-400">Фото прикреплено</div>
              </div>
              <button
                type="button"
                onclick="clearAttachedImage()"
                aria-label="Удалить фото"
                class="flex h-7 w-7 items-center justify-center rounded-full bg-[#2e2e2e] text-white transition hover:bg-[#3a3a3a]"
              >
                <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M18 6L6 18M6 6l12 12" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Капсула ввода: в обычном режиме справа синяя волна / стрелка; во время звонка справа микрофон и синий крестик как на фото -->
          <div class="composer-box flex items-end gap-2 rounded-[28px] px-3 py-2">
            <input
              type="file"
              id="imageFileInput"
              accept="image/*"
              class="hidden"
              onchange="handleImageSelected(event)"
            />

            <!-- Значок + для прикрепления фото -->
            <button
              type="button"
              onclick="document.getElementById('imageFileInput').click()"
              title="Прикрепить фото"
              aria-label="Прикрепить фото"
              class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-transparent text-neutral-300 transition hover:bg-[#2f2f2f] hover:text-white active:scale-95"
            >
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
                <path d="M12 5v14M5 12h14" />
              </svg>
            </button>

            <textarea
              id="promptInput"
              rows="1"
              placeholder="Спросить Maf GPT"
              oninput="updateActionButtonState()"
              onkeydown="handleComposerKeydown(event)"
              onpaste="handleComposerPaste(event)"
              class="my-auto max-h-48 min-h-[24px] flex-1 resize-none bg-transparent py-1.5 text-[15px] leading-relaxed text-white placeholder-neutral-400 focus:outline-none focus:ring-0"
            ></textarea>

            <!-- Кнопки во время активного звонка (как на скриншоте: микрофон + синий крестик) -->
            <div id="dockedCallControls" class="hidden shrink-0 items-center gap-2">
              <button
                type="button"
                id="dockedMuteBtn"
                onclick="toggleLiveMute()"
                title="Выключить / включить микрофон"
                aria-label="Микрофон"
                class="flex h-9 w-9 items-center justify-center rounded-full bg-[#2c2c2c] text-white transition hover:bg-[#3a3a3a] active:scale-95"
              >
                <svg id="dockedMicOnIcon" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                  <line x1="12" y1="19" x2="12" y2="22" />
                </svg>
                <svg id="dockedMicOffIcon" class="hidden h-4 w-4 text-neutral-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="2" y1="2" x2="22" y2="22" />
                  <path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2" />
                  <path d="M5 10v2a7 7 0 0 0 12 5" />
                  <path d="M15 9.34V5a3 3 0 0 0-5.68-1.33" />
                  <path d="M9 9v3a3 3 0 0 0 5.12 2.12" />
                  <line x1="12" y1="19" x2="12" y2="22" />
                </svg>
              </button>

              <button
                type="button"
                onclick="stopLiveCall()"
                title="Закончить разговор"
                aria-label="Закончить разговор"
                class="flex h-9 w-9 items-center justify-center rounded-full bg-[#2563eb] text-white transition hover:bg-[#1d4ed8] active:scale-95"
              >
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 6L6 18M6 6l12 12" />
                </svg>
              </button>
            </div>

            <!-- Умная кнопка в обычном режиме: если пусто — синяя кнопка живого звонка; если введён текст — белая стрелка вверх для отправки -->
            <button
              type="button"
              id="sendBtn"
              onclick="handlePrimaryActionClick()"
              title="Голосовой разговор"
              aria-label="Голосовой разговор"
              class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-[#2563eb] text-white transition-all duration-150 hover:bg-[#1d4ed8] active:scale-95 disabled:cursor-not-allowed disabled:opacity-45"
            >
              <!-- Иконка звуковых волн (режим звонка, когда поле пустое) -->
              <svg id="iconVoiceWave" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <path d="M5 10v4" />
                <path d="M9.5 7v10" />
                <path d="M14.5 5v14" />
                <path d="M19 9v6" />
              </svg>
              <!-- Иконка стрелки вверх (режим отправки текста, когда что-то введено) -->
              <svg id="iconSendArrow" class="hidden h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19V5" />
                <path d="M5 12l7-7 7 7" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Полноэкранный режим живого голосового звонка (с кнопкой сворачивания вниз в чат) -->
  <div
    id="liveCallOverlay"
    class="fixed inset-0 z-50 hidden flex-col items-center justify-between bg-[#050505]/95 px-6 py-8 backdrop-blur-xl"
  >
    <div class="flex w-full max-w-3xl items-center justify-between">
      <button
        type="button"
        onclick="setLiveCallCollapsed(true)"
        title="Свернуть вниз и открыть чат"
        class="flex items-center gap-1.5 rounded-full bg-[#1f1f1f] px-3.5 py-2 text-xs font-medium text-white transition hover:bg-[#2c2c2c]"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6 6-6" />
        </svg>
        <span>В чат</span>
      </button>

      <div class="flex flex-col items-center text-center">
        <span class="text-base font-semibold tracking-tight text-white">Maf GPT</span>
        <span id="liveCallStatus" class="text-xs text-neutral-400">Подключение...</span>
      </div>

      <div class="w-16"></div>
    </div>

    <!-- Центральная анимированная сфера голоса -->
    <div class="flex flex-col items-center justify-center gap-6">
      <div
        id="liveVoiceOrb"
        class="sky-orb voice-orb-active h-40 w-40 rounded-full transition-transform duration-300 sm:h-48 sm:w-48"
      ></div>
      <p id="liveCallSubtitle" class="max-w-md text-center text-sm text-neutral-300 min-h-[20px]"></p>
    </div>

    <!-- Нижняя панель управления звонком: кнопка микрофона (вкл/выкл) и синий крестик (завершить звонок) -->
    <div class="flex items-center gap-6">
      <button
        type="button"
        id="liveMuteBtn"
        onclick="toggleLiveMute()"
        title="Выключить / включить микрофон"
        aria-label="Микрофон"
        class="flex h-14 w-14 items-center justify-center rounded-full bg-[#212121] text-white transition hover:bg-[#2f2f2f] active:scale-95"
      >
        <svg id="micOnIcon" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
          <line x1="12" y1="19" x2="12" y2="22" />
        </svg>
        <svg id="micOffIcon" class="hidden h-6 w-6 text-neutral-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="2" y1="2" x2="22" y2="22" />
          <path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2" />
          <path d="M5 10v2a7 7 0 0 0 12 5" />
          <path d="M15 9.34V5a3 3 0 0 0-5.68-1.33" />
          <path d="M9 9v3a3 3 0 0 0 5.12 2.12" />
          <line x1="12" y1="19" x2="12" y2="22" />
        </svg>
      </button>

      <button
        type="button"
        id="liveHangupBtn"
        onclick="stopLiveCall()"
        title="Закончить разговор"
        aria-label="Закончить разговор"
        class="flex h-14 w-14 items-center justify-center rounded-full bg-[#2563eb] text-white transition hover:bg-[#1d4ed8] active:scale-95"
      >
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6L6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Модальное окно переименования чата -->
  <div
    id="renameModal"
    class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 p-4 backdrop-blur-xs"
  >
    <div class="w-full max-w-sm rounded-2xl bg-[#1c1c1c] p-5 shadow-2xl">
      <h3 class="mb-3 text-sm font-semibold text-white">Переименовать чат</h3>
      <input
        type="text"
        id="renameChatInput"
        onkeydown="if(event.key==='Enter') confirmRenameChat()"
        class="w-full rounded-xl bg-[#121212] px-3.5 py-2.5 text-sm text-white focus:outline-none"
      />
      <div class="mt-4 flex justify-end gap-2">
        <button
          type="button"
          onclick="closeRenameModal()"
          class="rounded-xl bg-[#2a2a2a] px-4 py-1.5 text-xs font-medium text-white hover:bg-[#363636]"
        >
          Отмена
        </button>
        <button
          type="button"
          onclick="confirmRenameChat()"
          class="rounded-xl bg-[#2563eb] px-4 py-1.5 text-xs font-medium text-white hover:bg-[#1d4ed8]"
        >
          Сохранить
        </button>
      </div>
    </div>
  </div>

  <!-- Модальное окно предпросмотра HTML-кода (кнопка Play как на 2 фото) -->
  <div
    id="codePreviewModal"
    class="fixed inset-0 z-50 hidden flex-col bg-black/90 p-3 backdrop-blur-xs sm:p-6"
  >
    <div class="mx-auto flex h-full w-full max-w-4xl flex-col overflow-hidden rounded-2xl bg-[#1a1a1a] shadow-2xl">
      <div class="flex items-center justify-between bg-[#252525] px-4 py-3">
        <span class="text-xs font-semibold text-white">Предпросмотр кода</span>
        <button
          type="button"
          onclick="closeCodePreviewModal()"
          class="flex h-8 w-8 items-center justify-center rounded-lg bg-[#333333] text-white hover:bg-[#444444]"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
      <iframe
        id="codePreviewFrame"
        sandbox="allow-scripts"
        class="h-full w-full flex-1 bg-white"
      ></iframe>
    </div>
  </div>

  <script>
    /**
     * Maf GPT — Состояние приложения и постоянное хранилище
     */
    const STORAGE_KEYS = {
      CHATS: 'maf_gpt_chats_bw_v1',
      ACTIVE_CHAT: 'maf_gpt_active_chat_bw_v1',
    };

    const state = {
      chats: [],
      activeChatId: null,
      reasoningLevel: 'max',
      attachedImage: null,
      isGenerating: false,
      abortController: null,
      streamTimer: null,
      greetingTimer: null,
      imageProgressTimer: null,
      imageProgressValue: 1,
    };

    document.addEventListener('DOMContentLoaded', () => {
      loadPersistedState();
      ensureActiveChat();
      renderSidebar();
      renderMessages();
      updateActionButtonState();
      document.getElementById('promptInput')?.focus();
    });

    function loadPersistedState() {
      try {
        const savedChats = localStorage.getItem(STORAGE_KEYS.CHATS);
        if (savedChats) {
          const parsed = JSON.parse(savedChats);
          if (Array.isArray(parsed)) state.chats = parsed;
        }
      } catch (_) {
        state.chats = [];
      }

      state.activeChatId = localStorage.getItem(STORAGE_KEYS.ACTIVE_CHAT) || null;
    }

    function saveChats() {
      try {
        localStorage.setItem(STORAGE_KEYS.CHATS, JSON.stringify(state.chats));
        if (state.activeChatId) {
          localStorage.setItem(STORAGE_KEYS.ACTIVE_CHAT, state.activeChatId);
        }
      } catch (_) {
        showToast('Память заполнена — удалите старые диалоги');
      }
    }

    function ensureActiveChat() {
      if (!state.chats.length) {
        createNewChat(false);
        return;
      }
      const found = state.chats.find(c => c.id === state.activeChatId);
      state.activeChatId = found ? found.id : state.chats[0].id;
    }

    function getActiveChat() {
      return state.chats.find(c => c.id === state.activeChatId) || null;
    }

    function createNewChat(shouldRender = true) {
      if (state.isGenerating) stopStreaming();
      const id = 'chat_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
      const newChat = {
        id,
        title: 'Новый чат',
        updatedAt: Date.now(),
        messages: [],
      };
      state.chats.unshift(newChat);
      state.activeChatId = id;
      saveChats();

      if (shouldRender) {
        renderSidebar();
        renderMessages();
        toggleSidebar(false);
        document.getElementById('promptInput')?.focus();
      }
    }

    function selectChat(chatId) {
      if (state.isGenerating) stopStreaming();
      state.activeChatId = chatId;
      saveChats();
      renderSidebar();
      renderMessages();
      toggleSidebar(false);
    }

    function deleteChat(event, chatId) {
      event.stopPropagation();
      if (state.isGenerating && state.activeChatId === chatId) stopStreaming();
      state.chats = state.chats.filter(c => c.id !== chatId);
      if (!state.chats.length) {
        createNewChat(false);
      } else if (state.activeChatId === chatId) {
        state.activeChatId = state.chats[0].id;
      }
      saveChats();
      renderSidebar();
      renderMessages();
    }

    function clearAllChats() {
      if (state.isGenerating) stopStreaming();
      state.chats = [];
      createNewChat(false);
      renderSidebar();
      renderMessages();
      showToast('История очищена');
    }

    let renamingChatId = null;

    function openRenameModal(event, chatId) {
      event.stopPropagation();
      const chat = state.chats.find(c => c.id === chatId);
      if (!chat) return;
      renamingChatId = chatId;
      const input = document.getElementById('renameChatInput');
      input.value = chat.title || '';
      const modal = document.getElementById('renameModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(() => input.focus(), 30);
    }

    function closeRenameModal() {
      renamingChatId = null;
      const modal = document.getElementById('renameModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function confirmRenameChat() {
      if (!renamingChatId) return;
      const newTitle = document.getElementById('renameChatInput').value.trim();
      if (newTitle) {
        const chat = state.chats.find(c => c.id === renamingChatId);
        if (chat) {
          chat.title = newTitle;
          saveChats();
          renderSidebar();
        }
      }
      closeRenameModal();
    }

    function toggleSidebar(open) {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebarBackdrop');
      if (open) {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      }
    }

    function renderSidebar() {
      const listEl = document.getElementById('chatHistoryList');
      if (!listEl) return;

      if (!state.chats.length) {
        listEl.innerHTML = `<div class="px-3 py-6 text-center text-xs text-neutral-500">Нет диалогов</div>`;
        return;
      }

      listEl.innerHTML = state.chats
        .map(chat => {
          const active = chat.id === state.activeChatId;
          return `
            <div
              onclick="selectChat('${chat.id}')"
              class="group flex cursor-pointer items-center justify-between gap-2 rounded-xl px-3 py-2 text-[13px] transition ${
                active
                  ? 'bg-[#212121] font-medium text-white'
                  : 'text-neutral-300 hover:bg-[#181818] hover:text-white'
              }"
            >
              <span class="truncate">${escapeHtml(chat.title || 'Новый чат')}</span>
              <div class="flex shrink-0 items-center gap-1 opacity-0 transition group-hover:opacity-100">
                <button
                  type="button"
                  onclick="openRenameModal(event, '${chat.id}')"
                  title="Переименовать"
                  class="flex h-6 w-6 items-center justify-center rounded-lg bg-transparent text-neutral-400 transition hover:bg-[#2f2f2f] hover:text-white"
                >
                  <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                  </svg>
                </button>
                <button
                  type="button"
                  onclick="deleteChat(event, '${chat.id}')"
                  title="Удалить"
                  class="flex h-6 w-6 items-center justify-center rounded-lg bg-transparent text-neutral-400 transition hover:bg-[#2f2f2f] hover:text-white"
                >
                  <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" />
                  </svg>
                </button>
              </div>
            </div>
          `;
        })
        .join('');
    }

    /**
     * Работа с изображениями (загрузка, сжатие и скачивание в галерею)
     */
    function processImageFile(file) {
      if (!file || !file.type.startsWith('image/')) {
        showToast('Выберите изображение');
        return;
      }
      if (file.size > 15 * 1024 * 1024) {
        showToast('Максимум 15 МБ');
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        const rawDataUrl = String(reader.result || '');
        const img = new Image();
        img.onload = () => {
          const maxDim = 1024;
          let width = img.width;
          let height = img.height;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const outMime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
          const compressedDataUrl = canvas.toDataURL(outMime, 0.88);
          const base64 = compressedDataUrl.split(',')[1] || '';

          state.attachedImage = {
            name: file.name || `photo_${Date.now()}.jpg`,
            mimeType: outMime,
            base64,
            dataUrl: compressedDataUrl,
          };
          document.getElementById('imagePreviewThumb').src = compressedDataUrl;
          document.getElementById('imagePreviewName').textContent = state.attachedImage.name;
          document.getElementById('imagePreviewContainer').classList.remove('hidden');
          updateActionButtonState();
        };
        img.onerror = () => showToast('Не удалось открыть фото');
        img.src = rawDataUrl;
      };
      reader.readAsDataURL(file);
    }

    function handleImageSelected(event) {
      const file = event.target.files?.[0];
      if (file) processImageFile(file);
      event.target.value = '';
    }

    function handleComposerPaste(event) {
      const items = event.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type && item.type.startsWith('image/')) {
          const file = item.getAsFile();
          if (file) {
            event.preventDefault();
            processImageFile(file);
            break;
          }
        }
      }
    }

    function clearAttachedImage() {
      state.attachedImage = null;
      const preview = document.getElementById('imagePreviewContainer');
      if (preview) preview.classList.add('hidden');
      const thumb = document.getElementById('imagePreviewThumb');
      if (thumb) thumb.src = '';
      updateActionButtonState();
    }

    function downloadGeneratedImage(msgIndex) {
      const chat = getActiveChat();
      const msg = chat?.messages?.[msgIndex];
      const dataUrl = msg?.generatedImageUrl;
      if (!dataUrl) {
        showToast('Изображение недоступно');
        return;
      }

      try {
        const link = document.createElement('a');
        link.href = dataUrl;
        const ext = dataUrl.startsWith('data:image/jpeg') ? 'jpg' : 'png';
        link.download = `MafGPT_${Date.now()}.${ext}`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('Фото сохранено в галерею');
      } catch (_) {
        showToast('Не удалось скачать фото');
      }
    }

    /**
     * Отрисовка стартового экрана с плавной анимацией смены заголовка и ленты сообщений
     */
    const GREETING_PHRASES = [
      'Чем помочь сегодня?',
      'Можем начинать.',
      'Какая идея у нас на очереди?',
      'Готов к любым задачам.',
      'Спросите о чём угодно.',
      'Создадим что-то крутое?',
    ];

    function startGreetingAnimation() {
      if (state.greetingTimer) {
        clearInterval(state.greetingTimer);
        state.greetingTimer = null;
      }
      const el = document.getElementById('animatedGreeting');
      if (!el) return;

      let phraseIndex = 0;
      el.textContent = GREETING_PHRASES[0];
      el.classList.remove('greeting-hidden');
      el.classList.add('greeting-visible');

      state.greetingTimer = setInterval(() => {
        const target = document.getElementById('animatedGreeting');
        if (!target) {
          clearInterval(state.greetingTimer);
          state.greetingTimer = null;
          return;
        }
        target.classList.remove('greeting-visible');
        target.classList.add('greeting-hidden');

        setTimeout(() => {
          const finalEl = document.getElementById('animatedGreeting');
          if (!finalEl) return;
          phraseIndex = (phraseIndex + 1) % GREETING_PHRASES.length;
          finalEl.textContent = GREETING_PHRASES[phraseIndex];
          finalEl.classList.remove('greeting-hidden');
          finalEl.classList.add('greeting-visible');
        }, 520);
      }, 2800);
    }

    function handleComposerKeydown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        if (!state.isGenerating) {
          sendMessage();
        }
      }
    }

    /**
     * Переключение кнопки справа:
     * - Во время активного звонка: если поле пустое -> кнопки микрофона и крестика; если введён текст -> стрелка отправки
     * - Вне звонка: если поле пустое -> синяя кнопка звонка; если введён текст -> белая стрелка отправки
     */
    function updateActionButtonState() {
      const input = document.getElementById('promptInput');
      const btn = document.getElementById('sendBtn');
      const dockedControls = document.getElementById('dockedCallControls');
      const waveIcon = document.getElementById('iconVoiceWave');
      const arrowIcon = document.getElementById('iconSendArrow');
      if (!input || !btn || !waveIcon || !arrowIcon) return;

      const hasContent = input.value.trim().length > 0 || Boolean(state.attachedImage);

      if (liveState.active && liveState.collapsed) {
        if (hasContent) {
          dockedControls?.classList.add('hidden');
          dockedControls?.classList.remove('flex');
          btn.classList.remove('hidden');
          waveIcon.classList.add('hidden');
          arrowIcon.classList.remove('hidden');
          btn.classList.remove('bg-[#2563eb]', 'hover:bg-[#1d4ed8]', 'text-white');
          btn.classList.add('bg-white', 'hover:bg-neutral-200', 'text-black');
          btn.title = 'Отправить сообщение';
        } else {
          btn.classList.add('hidden');
          dockedControls?.classList.remove('hidden');
          dockedControls?.classList.add('flex');
        }
        return;
      }

      dockedControls?.classList.add('hidden');
      dockedControls?.classList.remove('flex');
      btn.classList.remove('hidden');

      if (hasContent) {
        waveIcon.classList.add('hidden');
        arrowIcon.classList.remove('hidden');
        btn.classList.remove('bg-[#2563eb]', 'hover:bg-[#1d4ed8]', 'text-white');
        btn.classList.add('bg-white', 'hover:bg-neutral-200', 'text-black');
        btn.title = 'Отправить сообщение';
        btn.setAttribute('aria-label', 'Отправить сообщение');
      } else {
        arrowIcon.classList.add('hidden');
        waveIcon.classList.remove('hidden');
        btn.classList.remove('bg-white', 'hover:bg-neutral-200', 'text-black');
        btn.classList.add('bg-[#2563eb]', 'hover:bg-[#1d4ed8]', 'text-white');
        btn.title = 'Голосовой звонок';
        btn.setAttribute('aria-label', 'Голосовой звонок');
      }
    }

    function handlePrimaryActionClick() {
      const input = document.getElementById('promptInput');
      const hasContent = (input && input.value.trim().length > 0) || Boolean(state.attachedImage);
      if (hasContent) {
        sendMessage();
      } else {
        startLiveCall();
      }
    }

    async function sendMessage() {
      if (state.isGenerating) return;
      const input = document.getElementById('promptInput');
      const rawText = input ? input.value.trim() : '';
      const attached = state.attachedImage ? { ...state.attachedImage } : null;

      if (!rawText && !attached) return;

      const chat = getActiveChat();
      if (!chat) return;

      const isImageJob = isImageGenerationRequest(rawText, Boolean(attached));

      const userMsg = {
        role: 'user',
        content: rawText,
        imageDataUrl: attached ? attached.dataUrl : null,
        imageBase64: attached ? attached.base64 : null,
        imageMimeType: attached ? attached.mimeType : null,
        timestamp: Date.now(),
      };

      chat.messages.push(userMsg);
      if (chat.messages.length === 1 && rawText) {
        chat.title = rawText.length > 36 ? rawText.slice(0, 36) + '...' : rawText;
      }
      chat.updatedAt = Date.now();

      if (input) input.value = '';
      clearAttachedImage();
      updateActionButtonState();

      const assistantMsg = {
        role: 'assistant',
        content: '',
        generatedImageUrl: null,
        isImageJob,
        isStreaming: true,
        timestamp: Date.now(),
      };
      chat.messages.push(assistantMsg);

      state.isGenerating = true;
      setGeneratingUI(true);
      if (isImageJob) {
        startImageProgressAnimation();
      }

      saveChats();
      renderSidebar();
      renderMessages();

      try {
        if (isImageJob) {
          const imgRes = await fetchGeneratedImage(rawText || 'Создай красивое изображение', attached);
          stopImageProgressAnimation();
          assistantMsg.generatedImageUrl = imgRes.imageUrl;
          assistantMsg.content = imgRes.answer;
          assistantMsg.isStreaming = false;
        } else {
          const historyForApi = chat.messages.slice(0, -1);
          let lastRenderTime = 0;

          const textRes = await fetchTextResponseStream(historyForApi, state.reasoningLevel, (partialText) => {
            assistantMsg.content = partialText;
            const now = performance.now();
            if (now - lastRenderTime > 32) {
              lastRenderTime = now;
              renderMessages();
            }
          });

          if (textRes.detectedImagePrompt) {
            assistantMsg.isImageJob = true;
            renderMessages();
            const fallbackImg = await fetchGeneratedImage(textRes.detectedImagePrompt, attached);
            assistantMsg.generatedImageUrl = fallbackImg.imageUrl;
            assistantMsg.content = fallbackImg.answer;
            assistantMsg.isStreaming = false;
          } else {
            assistantMsg.content = textRes.answer;
            assistantMsg.isStreaming = false;
          }
        }
      } catch (err) {
        stopImageProgressAnimation();
        if (err?.name === 'AbortError') {
          assistantMsg.content = assistantMsg.content || 'Генерация остановлена.';
        } else {
          assistantMsg.content = `Не удалось получить ответ (${escapePlainError(err?.message)}). Попробуйте ещё раз.`;
        }
        assistantMsg.isStreaming = false;
      } finally {
        state.isGenerating = false;
        state.abortController = null;
        setGeneratingUI(false);
        chat.updatedAt = Date.now();
        saveChats();
        renderSidebar();
        renderMessages();
      }
    }

    function renderMessages() {
      const inner = document.getElementById('messagesInner');
      const chat = getActiveChat();
      if (!inner || !chat) return;

      if (!chat.messages.length) {
        inner.innerHTML = `
          <div class="flex flex-1 flex-col items-center justify-center px-3 pt-24 pb-8 text-center sm:pt-44 sm:pb-10">
            <div class="mb-4 flex h-12 w-12 items-center justify-center rounded-2xl bg-[#141416] shadow-lg">

    let dotWaveRafId = null;

    function startImageProgressAnimation() {
      stopImageProgressAnimation();
      state.imageProgressValue = 3;

      const animateCanvasDots = () => {
        const canvas = document.getElementById('imageDotWaveCanvas');
        if (canvas) {
          const rect = canvas.getBoundingClientRect();
          const w = Math.max(200, Math.floor(rect.width || 300));
          const h = Math.max(200, Math.floor(rect.height || 300));
          if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
          }
          const ctx = canvas.getContext('2d');
          if (ctx) {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, w, h);

            const cols = 22;
            const rows = 20;
            const stepX = w / cols;
            const stepY = h / rows;
            const t = performance.now() * 0.0032;

            for (let r = 0; r < rows; r++) {
              for (let c = 0; c < cols; c++) {
                const wave = Math.sin(c * 0.38 - t) * Math.cos(r * 0.34 - t * 0.8);
                const norm = (wave + 1) * 0.5;
                const radius = 0.9 + norm * 1.45;
                const alpha = 0.15 + norm * 0.85;

                ctx.beginPath();
                ctx.arc(c * stepX + stepX * 0.5, r * stepY + stepY * 0.5, radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(59, 130, 246, ${alpha.toFixed(3)})`;
                ctx.fill();
              }
            }
          }
        }
        dotWaveRafId = requestAnimationFrame(animateCanvasDots);
      };

      dotWaveRafId = requestAnimationFrame(animateCanvasDots);

      state.imageProgressTimer = setInterval(() => {
        if (state.imageProgressValue < 99) {

    /**

    function isImageGenerationRequest(text, hasAttachedImage) {
      if (!text) return false;
      const lower = text.toLowerCase().trim();

      if (hasAttachedImage) {
        return /(отредактируй|измени|убери фон|сделай из этого|перерисуй|преврати|улучши фото|добавь на фото)/i.test(lower);
      }

      // Любой запрос со словами "сделай фото...", "создай фото...", "нарисуй...", "сгенерируй картинку/изображение..."
      if (
        /(сделай|создай|нарисуй|сгенерируй|изобрази|покажи|draw|generate|create)\s+(мне\s+|пожалуйста\s+|как\s+)?(красивое\s+|крутое\s+|реалистичное\s+|милое\s+|смешное\s+)?(фото|фотку|картинк|изображен|арт|рисунок|логотип|аватар|обои|иллюстрац|портрет|image|picture|photo)/i.test(
          lower
        )
      ) {
        return true;
      }

      if (/^(нарисуй|сгенерируй фото|создай фото|сделай фото|draw\s+|generate\s+(an?\s+)?image)/i.test(lower)) {
        return true;
      }

      return false;
    }

    function isCodeGenerationRequest(text) {
      if (!text) return false;
      return /(напиши код|сделай код|создай код|сгенерируй код|код на |скрипт|программу|сайт на |html|python|javascript|c\+\+|lua|roblox скрипт)/i.test(text);
    }

    /**
     * Строгая очистка ответа — гарантированно блокирует любые JSON-промпты (dalle.text2im, action_input и т.д.)
     */
    function sanitizeModelOutput(rawText) {
      if (!rawText) return '';
      let cleaned = String(rawText);

      // Удаляем блоки рассуждений в тегах
      cleaned = cleaned.replace(/<thought>[\s\S]*?<\/thought>/gi, '');
      cleaned = cleaned.replace(/<thinking>[\s\S]*?<\/thinking>/gi, '');

      // Удаляем JSON-объекты вызова генерации изображений вроде {"action": "dalle.text2im", "action_input": ...}
      cleaned = cleaned.replace(/\(?\s*\{\s*"action"\s*:\s*"[^"]*dalle[^"]*"[\s\S]*?\}\s*\)?/gi, '');
      cleaned = cleaned.replace(/\(?\s*\{\s*"action_input"\s*:[\s\S]*?\}\s*\)?/gi, '');

      // Удаляем текстовые промпты
      cleaned = cleaned.replace(/```(prompt|image[_-]?prompt|midjourney|dalle|json)[\s\S]*?```/gi, (match) => {
        if (/dalle|text2im|action_input|aspect_ratio/i.test(match)) return '';
        return match;
      });
      cleaned = cleaned.replace(/^(Промпт|Prompt|Image prompt)\s*:.*$/gim, '');

      return cleaned.trim();
    }

    async function fetchGeneratedImage(promptText, attachedImage) {
      state.abortController = new AbortController();
      const apiKey = '';

      const parts = [{ text: promptText }];
      if (attachedImage && attachedImage.base64 && attachedImage.mimeType) {
        parts.push({
          inlineData: {
            mimeType: attachedImage.mimeType,
            data: attachedImage.base64,
          },
        });
      }

      const payload = {
        contents: [{ role: 'user', parts }],
        generationConfig: {
          responseModalities: ['IMAGE'],
        },
      };

      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${apiKey}`;
      const res = await fetchWithRetry(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: state.abortController.signal,
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData?.error?.message || `Ошибка генерации (${res.status})`);
      }

      const data = await res.json();
      const resParts = data?.candidates?.[0]?.content?.parts || [];
      const imgPart = resParts.find(p => p.inlineData);

      if (!imgPart?.inlineData?.data) {
        throw new Error('Не удалось сгенерировать изображение. Попробуйте другое описание.');
      }

      const mime = imgPart.inlineData.mimeType || 'image/png';
      const imageUrl = `data:${mime};base64,${imgPart.inlineData.data}`;

      return {
        imageUrl,
        answer:
          'Я создал фото по вашему запросу:\n' +
          '- **Готовый результат:** Изображение сгенерировано в высоком качестве и добавлено выше.\n' +
          '- **Сохранение:** Нажмите кнопку **«Скачать»** под картинкой, чтобы сохранить её в галерею.',
      };
    }

    async function fetchWithRetry(url, options, maxRetries = 4) {
      let delay = 1000;
      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        const res = await fetch(url, options);
        if (res.ok) return res;
        if ((res.status === 429 || res.status >= 500) && attempt < maxRetries) {
          await new Promise(resolve => setTimeout(resolve, delay));
          delay *= 2;
          continue;
        }
        return res;
      }
    }

    /**
     * Извлекает промпт, если модель попыталась вывести JSON формата dalle.text2im
     */
    function extractHiddenDallePrompt(rawText) {
      if (!rawText) return null;
      if (!/(dalle\.text2im|action_input)/i.test(rawText)) return null;
      const promptMatch = rawText.match(/"prompt"\s*:\s*\\?"([^"\\]+(?:\\.[^"\\]+)*)\\?"/i);
      if (promptMatch && promptMatch[1]) {
        return promptMatch[1].replace(/\\"/g, '"');
      }
      return 'Красивая иллюстрация по запросу пользователя';
    }

    async function fetchTextResponse(historyMessages, reasoningLevel) {
      return fetchTextResponseStream(historyMessages, reasoningLevel, null);
    }

    async function fetchTextResponseStream(historyMessages, reasoningLevel, onChunk) {
      state.abortController = new AbortController();
      const apiKey = '';

      let systemInstructionText =
        'Ты Maf GPT — умный персональный ИИ-ассистент. ' +
        'Отвечай на русском языке максимально быстро, чётко, структурированно и по делу. ' +
        'ФОРМАТ ОТВЕТОВ: начинай с короткой вводной фразы (например: «Я подготовил ответ...», «Я создал код по вашему запросу:» и т.д.), а основные детали оформляй аккуратным списком с жирными заголовками пунктов (`- **Заголовок пункта:** подробное пояснение`). ' +
        'КАТЕГОРИЧЕСКИ ЗАПРЕЩЕНО: никогда не выводи JSON с action, dalle.text2im, action_input или текстовые промпты для генерации картинок. Никогда не выводи внутренние рассуждения или теги <thought>. ' +
        'Если пользователь просит код — начинай с фразы «Я создал код по вашему запросу:», затем давай полный рабочий код в блоке ```язык и список ключевых особенностей реализации.';
      if (reasoningLevel === 'max') {
        systemInstructionText +=
          '\n\nПроводи точный логический анализ без лишних задержек и сразу выдавай чистый финальный результат.';
      }

      const contents = historyMessages.map(m => {
        const parts = [];
        if (m.content) {
          parts.push({ text: m.content });
        }
        if (m.role === 'user' && m.imageBase64 && m.imageMimeType) {
          parts.push({
            inlineData: {
              mimeType: m.imageMimeType,
              data: m.imageBase64,
            },
          });
        }
        if (!parts.length) {
          parts.push({ text: 'Опиши и проанализируй это изображение.' });
        }
        return {
          role: m.role === 'assistant' ? 'model' : 'user',
          parts,
        };
      });

      const payload = {
        contents,
        systemInstruction: {
          parts: [{ text: systemInstructionText }],
        },
        generationConfig: {
          thinkingConfig: {
            thinkingBudget: 0,
          },
        },
      };

      const streamUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:streamGenerateContent?alt=sse&key=${apiKey}`;
      const res = await fetch(streamUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: state.abortController.signal,
      });

      if (!res.ok || !res.body) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData?.error?.message || `Ошибка сервера (${res.status})`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let sseBuffer = '';
      let rawAnswer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        sseBuffer += decoder.decode(value, { stream: true });

        const lines = sseBuffer.split(/\r?\n/);
        sseBuffer = lines.pop() || '';

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith('data:')) continue;
          const jsonStr = trimmed.slice(5).trim();
          if (!jsonStr || jsonStr === '[DONE]') continue;

          try {
            const chunkObj = JSON.parse(jsonStr);
            const parts = chunkObj?.candidates?.[0]?.content?.parts || [];
            for (const part of parts) {
              if (!part.thought && part.text) {
                rawAnswer += part.text;
              }
            }
            if (onChunk && rawAnswer) {
              const hiddenCheck = extractHiddenDallePrompt(rawAnswer);
              if (!hiddenCheck) {
                onChunk(sanitizeModelOutput(rawAnswer));
              }
            }
          } catch (_) {}
        }
      }

      const hiddenPrompt = extractHiddenDallePrompt(rawAnswer);
      if (hiddenPrompt) {
        return { detectedImagePrompt: hiddenPrompt, answer: '' };
      }

      rawAnswer = sanitizeModelOutput(rawAnswer);
      if (!rawAnswer) {
        rawAnswer = 'Не удалось сформировать ответ. Попробуйте переформулировать запрос.';
      }

      return { answer: rawAnswer };
    }

    /**
     * Живой голосовой разговор в реальном времени (непрерывный диалог с автодетекцией речи и голосом парня Puck как у ChatGPT)
     */
    const liveState = {

    /**
     * Сворачивает звонок вниз над полем ввода (как на скриншоте) или разворачивает обратно на весь экран
