<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Maf GPT</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Maf GPT" />
  <meta name="theme-color" content="#000000" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      min-width: 0;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .safe-top {
      padding-top: max(0.55rem, env(safe-area-inset-top));
    }
    .safe-bottom {
      padding-bottom: max(1rem, calc(env(safe-area-inset-bottom) + 0.6rem));
    }

    button {
      border: none !important;
      outline: none !important;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.22s ease, color 0.22s ease, opacity 0.22s ease, box-shadow 0.22s ease;
    }
    button:active {
      transform: scale(0.95);
    }

    .composer-box {
      background: #212121;
      border: 1px solid #383838;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.65);
      transition: background-color 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }
    .composer-box:focus-within {
      background: #242424;
      border-color: #525252;
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.8);
    }

    .screen-transition {
      transition: opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1), transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }
    .screen-hidden {
      opacity: 0;
      transform: scale(0.96) translateY(12px);
      pointer-events: none;
    }
    .screen-visible {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
    }

    @keyframes voice-orb-pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 36px rgba(37, 99, 235, 0.45), inset 0 0 26px rgba(255, 255, 255, 0.25);
      }
      50% {
        transform: scale(1.07);
        box-shadow: 0 0 60px rgba(59, 130, 246, 0.75), inset 0 0 36px rgba(255, 255, 255, 0.4);
      }
    }
    .voice-orb-active {
      animation: voice-orb-pulse 2s ease-in-out infinite;
    }
    .voice-orb-speaking {
      animation: voice-orb-pulse 0.78s ease-in-out infinite;
    }

    .sky-orb {
      background: radial-gradient(circle at 35% 28%, #93c5fd 0%, #3b82f6 42%, #1d4ed8 72%),
                  linear-gradient(180deg, #2563eb 0%, #60a5fa 60%, #eff6ff 100%);
      position: relative;
      overflow: hidden;
    }
    .sky-orb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 88%, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0.45) 36%, transparent 70%);
      pointer-events: none;
    }

    .greeting-fade {
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .greeting-hidden {
      opacity: 0;
      transform: translateY(6px);
    }
    .greeting-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes msg-slide-up {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-appear {
      animation: msg-slide-up 0.26s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .prose-maf p { margin-bottom: 0.85rem; line-height: 1.72; color: #f5f5f5; }
    .prose-maf p:last-child { margin-bottom: 0; }
    .prose-maf h1, .prose-maf h2, .prose-maf h3 { color: #ffffff; font-weight: 600; margin-top: 1.2rem; margin-bottom: 0.5rem; }
    .prose-maf ul, .prose-maf ol { margin: 0.5rem 0 0.9rem 1.35rem; line-height: 1.65; color: #f5f5f5; }
    .prose-maf ul { list-style-type: disc; }
    .prose-maf ol { list-style-type: decimal; }
    .prose-maf code:not(pre code) {
      background: #262626;
      padding: 0.15rem 0.4rem;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85em;
      color: #93c5fd;
    }

    .code-wrapper {
      margin: 0.9rem 0;
      border-radius: 16px;
      overflow: hidden;
      background: #2f2f2f;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }
    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.1rem;
      background: #2f2f2f;
      font-size: 0.85rem;
      font-weight: 500;
      color: #f5f5f5;
    }
    .code-body {
      margin: 0;
      padding: 0.5rem 1.2rem 1.2rem 1.2rem;
      overflow-x: auto;
      max-height: 440px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.83rem;
      line-height: 1.62;
      color: #f5f5f5;
    }

    textarea#promptInput {
      field-sizing: content;
      max-height: 200px;
      min-height: 26px;
      caret-color: #ffffff;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333333; border-radius: 999px; }
  </style>
</head>
<body class="flex flex-col md:flex-row bg-black text-white select-none">

  <!-- ЭКРАН ВВОДА API KEY ПРИ КАЖДОМ ВХОДЕ -->
  <div id="activationScreen" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-xl flex flex-col items-center justify-center p-6 screen-transition screen-visible">
    <div class="w-full max-w-sm bg-[#141414] border border-[#2b2b2b] rounded-3xl p-7 text-center shadow-2xl">
      <div class="w-16 h-16 mx-auto mb-5 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center shadow-lg shadow-blue-600/30">
        <svg class="w-9 h-9 text-white" viewBox="0 0 32 32" fill="none">
          <path d="M6 23V9L16 18L26 9V23" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16" cy="7" r="2.2" fill="#93c5fd"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight mb-2">Maf GPT</h1>
      <p class="text-sm text-neutral-400 mb-5 leading-relaxed">
        Введите ваш API Key для запуска сессии. Ключ хранится только в текущей сессии и сбрасывается при перезаходе.
      </p>

      <input
        id="sessionApiKeyInput"
        type="password"
        autocomplete="off"
        placeholder="Вставьте API Key..."
        onkeydown="if(event.key==='Enter') activateMafGpt()"
        class="w-full bg-[#1e1e1e] border border-[#343434] focus:border-blue-500 rounded-2xl px-4 py-3 text-sm text-white placeholder-neutral-500 focus:outline-none mb-4 select-text"
      />

      <button onclick="activateMafGpt()" class="w-full py-3.5 px-6 rounded-2xl bg-white text-black font-semibold text-base hover:bg-neutral-200 cursor-pointer">
        Активировать
      </button>
      <p id="keyErrorMsg" class="text-xs text-red-400 mt-3 min-h-[16px]"></p>
    </div>
  </div>

  <!-- ЗАТЕМНЕНИЕ ДЛЯ МОБИЛЬНОГО МЕНЮ -->
  <div id="mobileBackdrop" onclick="toggleMobileSidebar(false)" class="fixed inset-0 bg-black/70 z-30 hidden md:hidden backdrop-blur-xs"></div>

  <!-- БОКОВАЯ ПАНЕЛЬ -->
  <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-72 bg-[#0d0d0d] border-r border-[#1f1f1f] flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-out safe-top safe-bottom">
    <div class="px-4 py-3 flex items-center justify-between border-b border-[#1c1c1c]">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center">
          <svg class="w-4 h-4 text-white" viewBox="0 0 32 32" fill="none">
            <path d="M6 23V9L16 18L26 9V23" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="16" cy="7" r="2.3" fill="#93c5fd"/>
          </svg>
        </div>
        <span class="font-semibold text-base tracking-tight">Maf GPT</span>
      </div>
      <button onclick="toggleMobileSidebar(false)" class="md:hidden w-8 h-8 rounded-lg bg-[#1c1c1c] text-neutral-300 flex items-center justify-center hover:bg-[#2a2a2a]" aria-label="Закрыть">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="p-3 space-y-2">
      <button onclick="createNewChat()" class="w-full py-2.5 px-3.5 rounded-xl bg-[#1b1b1b] hover:bg-[#262626] text-white text-sm font-medium flex items-center gap-2.5 cursor-pointer">
        <svg class="w-4 h-4 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
        Новый чат
      </button>
      <button onclick="openKeyModal()" class="w-full py-2 px-3.5 rounded-xl bg-[#141414] hover:bg-[#202020] text-neutral-300 text-xs font-medium flex items-center gap-2 cursor-pointer">
        <svg class="w-3.5 h-3.5 text-neutral-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        Сменить API Key
      </button>
    </div>

    <div class="px-4 pt-2 pb-1 text-[11px] font-semibold uppercase tracking-wider text-neutral-500">
      История разговоров
    </div>
    <div id="chatHistoryList" class="flex-1 overflow-y-auto px-2.5 space-y-1"></div>

    <div class="p-3 border-t border-[#1c1c1c] flex items-center justify-between text-xs text-neutral-500">
      <span>Maf GPT</span>
      <button onclick="clearAllHistory()" class="text-neutral-400 hover:text-white px-2 py-1 rounded-lg hover:bg-[#1c1c1c] cursor-pointer">
        Очистить
      </button>
    </div>
  </aside>

  <!-- ОСНОВНОЙ ЭКРАН -->
  <main class="flex-1 flex flex-col h-full relative bg-black">
    <header class="safe-top px-4 pb-2.5 flex items-center justify-between border-b border-[#161616] bg-black/90 backdrop-blur-md z-20">
      <div class="flex items-center gap-2.5">
        <button onclick="toggleMobileSidebar(true)" class="md:hidden w-9 h-9 rounded-xl bg-[#161616] hover:bg-[#222222] flex items-center justify-center text-white cursor-pointer" aria-label="Меню">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center">
            <svg class="w-4 h-4 text-white" viewBox="0 0 32 32" fill="none">
              <path d="M6 23V9L16 18L26 9V23" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="16" cy="7" r="2.3" fill="#93c5fd"/>
            </svg>
          </div>
          <span class="font-semibold text-base tracking-tight">Maf GPT</span>
        </div>
      </div>

      <button onclick="createNewChat()" class="md:hidden w-9 h-9 rounded-xl bg-[#161616] hover:bg-[#222222] flex items-center justify-center text-neutral-200 cursor-pointer" title="Новый чат">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <div id="messagesContainer" class="flex-1 overflow-y-auto px-4 md:px-8 py-6 space-y-5">
      <div id="welcomeScreen" class="h-full flex flex-col items-center justify-center text-center px-4 pb-12">
        <div class="w-14 h-14 mb-5 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center shadow-lg shadow-blue-600/25">
          <svg class="w-8 h-8 text-white" viewBox="0 0 32 32" fill="none">
            <path d="M6 23V9L16 18L26 9V23" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="16" cy="7" r="2.2" fill="#93c5fd"/>
          </svg>
        </div>
        <h2 id="dynamicGreeting" class="text-2xl md:text-3xl font-semibold tracking-tight text-white greeting-fade greeting-visible">
          Можем начинать.
        </h2>
      </div>
    </div>

    <!-- СВЁРНУТАЯ ПАНЕЛЬ ЗВОНКА НАД ПОЛЕМ ВВОДА -->
    <div id="dockedCallBar" class="hidden px-4 pb-2 screen-transition screen-hidden">
      <div class="max-w-3xl mx-auto bg-[#161a24] border border-blue-500/30 rounded-2xl px-4 py-2.5 flex items-center justify-between shadow-lg">
        <div onclick="expandVoiceCall()" class="flex items-center gap-3 cursor-pointer flex-1">
          <div class="w-9 h-9 rounded-full sky-orb voice-orb-active shrink-0"></div>
          <div class="min-w-0">
            <div class="text-xs font-semibold text-blue-300">Maf GPT • Голос</div>
            <div id="dockedStatusText" class="text-xs text-neutral-300 truncate">Говорите...</div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="expandVoiceCall()" class="px-3 py-1.5 rounded-xl bg-blue-600/20 text-blue-300 text-xs font-medium hover:bg-blue-600/30 cursor-pointer">
            Развернуть
          </button>
          <button onclick="endVoiceCall()" class="w-8 h-8 rounded-xl bg-red-500/20 text-red-400 flex items-center justify-center hover:bg-red-500/30 cursor-pointer">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- КОМПОЗЕР -->
    <div class="safe-bottom px-4 pt-1 bg-black">
      <div class="max-w-3xl mx-auto">
        <div id="imagePreviewBar" class="hidden mb-2 px-3 py-2 rounded-2xl bg-[#181818] border border-[#2c2c2c] flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <img id="imagePreviewThumb" src="" alt="Фото" class="w-10 h-10 rounded-lg object-cover" />
            <span class="text-xs text-neutral-300">Фото прикреплено</span>
          </div>
          <button onclick="removeAttachedImage()" class="w-7 h-7 rounded-lg bg-[#262626] text-neutral-300 flex items-center justify-center hover:text-white cursor-pointer">×</button>
        </div>

        <div class="composer-box rounded-[26px] px-3.5 py-2 flex items-end gap-2">
          <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)" />
          <button onclick="document.getElementById('imageInput').click()" class="w-9 h-9 rounded-full text-neutral-400 hover:text-white hover:bg-[#2f2f2f] flex items-center justify-center shrink-0 cursor-pointer" title="Прикрепить фото">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>

          <textarea
            id="promptInput"
            rows="1"
            placeholder="Спросить Maf GPT..."
            class="flex-1 bg-transparent text-white placeholder-neutral-500 text-[15px] leading-relaxed resize-none focus:outline-none py-1.5 select-text"
            oninput="updateActionButton()"
            onkeydown="handleInputKeydown(event)"
          ></textarea>

          <button id="primaryActionBtn" onclick="handlePrimaryAction()" class="w-9 h-9 rounded-full bg-blue-600 hover:bg-blue-500 text-white flex items-center justify-center shrink-0 shadow-md shadow-blue-600/30 cursor-pointer" title="Голосовой разговор">
            <svg id="voiceIcon" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <path d="M12 3v18M8 7v10M16 7v10M4 10v4M20 10v4"/>
            </svg>
            <svg id="sendIcon" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M5 12l7-7 7 7"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- ПОЛНОЭКРАННЫЙ ГОЛОСОВОЙ РАЗГОВОР -->
  <div id="liveCallOverlay" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-2xl hidden flex-col justify-between p-6 safe-top safe-bottom screen-transition screen-hidden">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center">
          <svg class="w-4 h-4 text-white" viewBox="0 0 32 32" fill="none">
            <path d="M6 23V9L16 18L26 9V23" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="16" cy="7" r="2.3" fill="#93c5fd"/>
          </svg>
        </div>
        <div>
          <div class="font-semibold text-sm">Maf GPT Live</div>
          <div class="text-[11px] text-blue-400">Голосовой режим</div>
        </div>
      </div>

      <button onclick="dockVoiceCall()" class="px-4 py-2 rounded-full bg-[#1c1c1c] hover:bg-[#2a2a2a] text-sm font-medium text-white flex items-center gap-2 cursor-pointer">
        <svg class="w-4 h-4 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        В чат
      </button>
    </div>

    <div class="flex flex-col items-center justify-center my-auto text-center px-4">
      <div id="liveOrb" class="w-44 h-44 md:w-52 md:h-52 rounded-full sky-orb voice-orb-active mb-8"></div>
      <div id="liveStatusTitle" class="text-xl font-semibold text-white mb-2">Говорите...</div>
      <div id="liveTranscriptText" class="text-sm text-neutral-400 max-w-md min-h-[42px] leading-relaxed">
        Я слушаю вас.
      </div>
      <div class="w-48 h-1.5 bg-[#1f1f1f] rounded-full overflow-hidden mt-5">
        <div id="micLevelBar" class="h-full bg-blue-500 transition-all duration-75" style="width: 4%;"></div>
      </div>
    </div>

    <div class="flex items-center justify-center gap-5 pb-4">
      <button id="muteBtn" onclick="toggleMute()" class="w-14 h-14 rounded-full bg-[#1f1f1f] hover:bg-[#2c2c2c] text-white flex items-center justify-center cursor-pointer" title="Микрофон">
        <svg id="micOnIcon" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
        <svg id="micOffIcon" class="w-6 h-6 text-red-400 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23M12 19v4M8 23h8"/></svg>
      </button>

      <button onclick="endVoiceCall()" class="w-16 h-16 rounded-full bg-red-600 hover:bg-red-500 text-white flex items-center justify-center shadow-lg shadow-red-600/30 cursor-pointer" title="Завершить">
        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <script>
    // Ключ хранится только в оперативной памяти вкладки и очищается при каждом новом входе/обновлении
    let sessionApiKey = "";

    const MODELS_PRIORITY = [
      "gemini-3.8-flash",
      "gemini-3-flash-preview",
      "gemini-2.5-flash"
    ];

    const GREETINGS = [
      "Можем начинать.",
      "Чем помочь сегодня?",
      "Какая идея у нас на очереди?",
      "Готов к любым задачам.",
      "Спросите о чём угодно.",
      "Создадим что-то крутое?"
    ];

    let state = {
      chats: JSON.parse(localStorage.getItem("mafgpt_chats_v5") || "[]"),
      currentChatId: null,
      attachedImageBase64: null,
      attachedImageMime: null,
      isGenerating: false,
      greetingIndex: 0
    };

    let voiceState = {
      active: false,
      docked: false,
      muted: false,
      isSpeaking: false,
      isProcessing: false,
      audioCtx: null,
      mediaStream: null,
      processor: null,
      pcmChunks: [],
      speechStarted: false,
      silenceStart: 0
    };

    function openKeyModal() {
      const errEl = document.getElementById("keyErrorMsg");
      const inputEl = document.getElementById("sessionApiKeyInput");
      if (errEl) errEl.textContent = "";
      if (inputEl) inputEl.value = "";
      const screen = document.getElementById("activationScreen");
      screen.style.display = "flex";
      requestAnimationFrame(() => {
        screen.classList.remove("screen-hidden");
        screen.classList.add("screen-visible");
      });
    }

    function activateMafGpt() {
      const inputEl = document.getElementById("sessionApiKeyInput");
      const errEl = document.getElementById("keyErrorMsg");
      const entered = (inputEl?.value || "").trim();

      if (!entered) {
        if (errEl) errEl.textContent = "Введите ваш API Key.";
        return;
      }

      sessionApiKey = entered;
      if (errEl) errEl.textContent = "";

      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx && !voiceState.audioCtx) {
          voiceState.audioCtx = new AudioCtx();
          if (voiceState.audioCtx.state === "suspended") voiceState.audioCtx.resume();
        }
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      } catch (e) {}

      const screen = document.getElementById("activationScreen");
      screen.classList.remove("screen-visible");
      screen.classList.add("screen-hidden");
      setTimeout(() => { screen.style.display = "none"; }, 320);
    }

    async function callGeminiAPI(payload) {
      if (!sessionApiKey) {
        openKeyModal();
        throw new Error("API Key не введён для текущей сессии.");
      }

      let lastError = "Неизвестная ошибка";
      for (const model of MODELS_PRIORITY) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(sessionApiKey)}`;
        try {
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (res.ok && data?.candidates?.[0]?.content?.parts) {
            return data.candidates[0].content.parts.map(p => p.text || "").join("");
          }
          lastError = data?.error?.message || `HTTP ${res.status}`;
        } catch (err) {
          lastError = err.message || "Ошибка сети";
        }
      }
      throw new Error(lastError);
    }

    function saveChats() {
      localStorage.setItem("mafgpt_chats_v5", JSON.stringify(state.chats));
      renderHistoryList();
    }

    function getCurrentChat() {
      let chat = state.chats.find(c => c.id === state.currentChatId);
      if (!chat) {
        chat = { id: "chat_" + Date.now(), title: "Новый разговор", messages: [] };
        state.chats.unshift(chat);
        state.currentChatId = chat.id;
        saveChats();
      }
      return chat;
    }

    function createNewChat() {
      state.currentChatId = "chat_" + Date.now();
      state.chats.unshift({ id: state.currentChatId, title: "Новый разговор", messages: [] });
      saveChats();
      renderMessages();
      toggleMobileSidebar(false);
    }

    function selectChat(id) {
      state.currentChatId = id;
      renderMessages();
      renderHistoryList();
      toggleMobileSidebar(false);
    }

    function clearAllHistory() {
      state.chats = [];
      state.currentChatId = null;
      saveChats();
      renderMessages();
    }

    function renderHistoryList() {
      const list = document.getElementById("chatHistoryList");
      if (!state.chats.length) {
        list.innerHTML = `<div class="text-xs text-neutral-600 px-3 py-4 text-center">Пока нет сохранённых диалогов</div>`;
        return;
      }
      list.innerHTML = state.chats.map(chat => {
        const active = chat.id === state.currentChatId;
        return `
          <button onclick="selectChat('${chat.id}')" class="w-full text-left px-3 py-2.5 rounded-xl text-sm truncate cursor-pointer ${active ? "bg-[#222222] text-white font-medium" : "text-neutral-400 hover:bg-[#171717] hover:text-neutral-200"}">
            ${escapeHtml(chat.title)}
          </button>
        `;
      }).join("");
    }

    function toggleMobileSidebar(open) {
      const sidebar = document.getElementById("sidebar");
      const backdrop = document.getElementById("mobileBackdrop");
      if (open) {
        sidebar.classList.remove("-translate-x-full");
        backdrop.classList.remove("hidden");
      } else {
        sidebar.classList.add("-translate-x-full");
        backdrop.classList.add("hidden");
      }
    }

    function updateActionButton() {
      const input = document.getElementById("promptInput");
      const voiceIcon = document.getElementById("voiceIcon");
      const sendIcon = document.getElementById("sendIcon");
      const hasContent = input.value.trim().length > 0 || Boolean(state.attachedImageBase64);
      voiceIcon.classList.toggle("hidden", hasContent);
      sendIcon.classList.toggle("hidden", !hasContent);
    }

    function handlePrimaryAction() {
      const input = document.getElementById("promptInput");
      const hasContent = input.value.trim().length > 0 || Boolean(state.attachedImageBase64);
      if (hasContent) sendTextMessage();
      else startVoiceCall();
    }

    function handleInputKeydown(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendTextMessage();
      }
    }

    function handleImageUpload(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const res = reader.result;
        state.attachedImageBase64 = res.split(",")[1];
        state.attachedImageMime = file.type || "image/jpeg";
        document.getElementById("imagePreviewThumb").src = res;
        document.getElementById("imagePreviewBar").classList.remove("hidden");
        updateActionButton();
      };
      reader.readAsDataURL(file);
    }

    function removeAttachedImage() {
      state.attachedImageBase64 = null;
      state.attachedImageMime = null;
      document.getElementById("imageInput").value = "";
      document.getElementById("imagePreviewBar").classList.add("hidden");
      updateActionButton();
    }

    async function sendTextMessage() {
      if (state.isGenerating) return;
      if (!sessionApiKey) {
        openKeyModal();
        return;
      }

      const input = document.getElementById("promptInput");
      const text = input.value.trim();
      const imgBase64 = state.attachedImageBase64;
      const imgMime = state.attachedImageMime;
      if (!text && !imgBase64) return;

      const chat = getCurrentChat();
      if (chat.messages.length === 0 && text) chat.title = text.slice(0, 36);

      chat.messages.push({
        role: "user",
        text: text || "Изображение",
        image: imgBase64 ? `data:${imgMime};base64,${imgBase64}` : null
      });

      input.value = "";
      removeAttachedImage();
      updateActionButton();

      state.isGenerating = true;
      chat.messages.push({ role: "model", text: "Думаю над ответом...", isThinking: true });
      saveChats();
      renderMessages();

      try {
        const contents = chat.messages
          .filter(m => !m.isThinking)
          .slice(-10)
          .map((m, idx, arr) => {
            const parts = [];
            if (m.text) parts.push({ text: m.text });
            if (m.image && m.role === "user" && idx === arr.length - 1 && imgBase64) {
              parts.push({ inline_data: { mime_type: imgMime, data: imgBase64 } });
            }
            return { role: m.role, parts };
          });

        const reply = await callGeminiAPI({
          systemInstruction: {
            parts: [{ text: "Ты Maf GPT. Отвечай на русском языке чётко и по делу." }]
          },
          contents
        });

        chat.messages.pop();
        chat.messages.push({ role: "model", text: reply });
      } catch (err) {
        chat.messages.pop();
        chat.messages.push({
          role: "model",
          text: `Не удалось получить ответ (${err.message}).`
        });
      } finally {
        state.isGenerating = false;
        saveChats();
        renderMessages();
      }
    }

    function renderMessages() {
      const container = document.getElementById("messagesContainer");
      const chat = state.chats.find(c => c.id === state.currentChatId);

      if (!chat || chat.messages.length === 0) {
        container.innerHTML = `
          <div id="welcomeScreen" class="h-full flex flex-col items-center justify-center text-center px-4 pb-12">
            <div class="w-14 h-14 mb-5 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center shadow-lg shadow-blue-600/25">
              <svg class="w-8 h-8 text-white" viewBox="0 0 32 32" fill="none">
                <path d="M6 23V9L16 18L26 9V23" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="16" cy="7" r="2.2" fill="#93c5fd"/>
              </svg>
            </div>
            <h2 id="dynamicGreeting" class="text-2xl md:text-3xl font-semibold tracking-tight text-white greeting-fade greeting-visible">
              ${GREETINGS[state.greetingIndex]}
            </h2>
          </div>
        `;
        return;
      }

      container.innerHTML = `<div class="max-w-3xl mx-auto space-y-5">` + chat.messages.map(msg => {
        if (msg.role === "user") {
          return `
            <div class="flex justify-end msg-appear">
              <div class="max-w-[82%] bg-[#242424] text-white rounded-3xl rounded-br-md px-4 py-3 text-[15px] leading-relaxed">
                ${msg.image ? `<img src="${msg.image}" class="max-h-56 rounded-xl mb-2 object-contain" />` : ""}
                <div class="whitespace-pre-wrap select-text">${escapeHtml(msg.text)}</div>
              </div>
            </div>
          `;
        }
        if (msg.isThinking) {
          return `
            <div class="flex items-start gap-3 msg-appear">
              <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center shrink-0 mt-0.5">
                <svg class="w-4 h-4 text-white" viewBox="0 0 32 32" fill="none">
                  <path d="M6 23V9L16 18L26 9V23" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
              <div class="text-sm text-neutral-400 italic py-1">Думаю над ответом...</div>
            </div>
          `;
        }
        return `
          <div class="flex items-start gap-3 msg-appear">
            <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center shrink-0 mt-0.5">
              <svg class="w-4 h-4 text-white" viewBox="0 0 32 32" fill="none">
                <path d="M6 23V9L16 18L26 9V23" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="flex-1 prose-maf text-[15px] select-text overflow-hidden">
              ${formatMarkdown(msg.text)}
            </div>
          </div>
        `;
      }).join("") + `</div>`;

      container.scrollTop = container.scrollHeight;
    }

    function formatMarkdown(text) {
      const codeBlocks = [];
      let processed = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
        const idx = codeBlocks.length;
        codeBlocks.push({ lang: lang || "code", code });
        return `@@CODEBLOCK_${idx}@@`;
      });

      processed = escapeHtml(processed)
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\n\n+/g, "</p><p>")
        .replace(/\n/g, "<br/>");

      processed = `<p>${processed}</p>`;

      codeBlocks.forEach((blk, i) => {
        const encoded = encodeURIComponent(blk.code);
        processed = processed.replace(`@@CODEBLOCK_${i}@@`, `
          <div class="code-wrapper">
            <div class="code-header">
              <span>${escapeHtml(blk.lang)}</span>
              <button onclick="copyCodeBlock(this, '${encoded}')" class="px-2.5 py-1 rounded-lg bg-[#3c3c3c] hover:bg-[#4b4b4b] text-xs text-white cursor-pointer">
                Копировать
              </button>
            </div>
            <pre class="code-body"><code>${escapeHtml(blk.code)}</code></pre>
          </div>
        `);
      });

      return processed;
    }

    function copyCodeBlock(btn, encoded) {
      navigator.clipboard.writeText(decodeURIComponent(encoded));
      const prev = btn.textContent;
      btn.textContent = "Скопировано";
      setTimeout(() => (btn.textContent = prev), 1400);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function startVoiceCall() {
      if (!sessionApiKey) {
        openKeyModal();
        return;
      }

      const overlay = document.getElementById("liveCallOverlay");
      overlay.classList.remove("hidden");
      overlay.classList.add("flex");
      requestAnimationFrame(() => {
        overlay.classList.remove("screen-hidden");
        overlay.classList.add("screen-visible");
      });

      voiceState.active = true;
      voiceState.docked = false;
      voiceState.muted = false;
      voiceState.isProcessing = false;
      voiceState.isSpeaking = false;

      updateVoiceStatus("Говорите...", "Подключаю микрофон...");

      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!voiceState.audioCtx) voiceState.audioCtx = new AudioCtx();
        if (voiceState.audioCtx.state === "suspended") await voiceState.audioCtx.resume();

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        voiceState.mediaStream = stream;

        const source = voiceState.audioCtx.createMediaStreamSource(stream);
        const processor = voiceState.audioCtx.createScriptProcessor(4096, 1, 1);

        voiceState.pcmChunks = [];
        voiceState.speechStarted = false;
        voiceState.silenceStart = 0;

        processor.onaudioprocess = (e) => {
          if (!voiceState.active || voiceState.muted || voiceState.isProcessing || voiceState.isSpeaking) {
            document.getElementById("micLevelBar").style.width = "3%";
            return;
          }
          const data = e.inputBuffer.getChannelData(0);
          let sum = 0;
          for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
          const rms = Math.sqrt(sum / data.length) * 100;
          document.getElementById("micLevelBar").style.width = Math.min(100, Math.max(4, rms * 14)) + "%";

          const now = Date.now();
          if (rms > 1.4) {
            if (!voiceState.speechStarted) {
              voiceState.speechStarted = true;
              voiceState.pcmChunks = [];
              updateVoiceStatus("Слушаю вас...", "Говорите...");
            }
            voiceState.silenceStart = now;
            voiceState.pcmChunks.push(new Float32Array(data));
          } else if (voiceState.speechStarted) {
            voiceState.pcmChunks.push(new Float32Array(data));
            if (now - voiceState.silenceStart > 680) {
              voiceState.speechStarted = false;
              const chunks = voiceState.pcmChunks.slice();
              voiceState.pcmChunks = [];
              processVoiceChunks(chunks, voiceState.audioCtx.sampleRate);
            }
          }
        };

        source.connect(processor);
        processor.connect(voiceState.audioCtx.destination);
        voiceState.processor = processor;

        updateVoiceStatus("Говорите...", "Я слушаю вас");
      } catch (err) {
        updateVoiceStatus("Нет доступа к микрофону", err.message);
      }
    }

    async function processVoiceChunks(chunks, sampleRate) {
      if (!chunks.length || voiceState.isProcessing) return;
      voiceState.isProcessing = true;
      updateVoiceStatus("Думаю над ответом...", "Обрабатываю речь...");

      try {
        const wavBase64 = encodeWavBase64(chunks, sampleRate);
        const result = await callGeminiAPI({
          systemInstruction: {
            parts: [{
              text: "Распознай речь на русском языке. Формат: первая строка 'ВОПРОС: <текст>', далее 'ОТВЕТ: <краткий ответ>'. Если слов нет, верни 'ПУСТО'."
            }]
          },
          contents: [{
            role: "user",
            parts: [
              { inline_data: { mime_type: "audio/wav", data: wavBase64 } },
              { text: "Ответь на голосовой запрос." }
            ]
          }]
        });

        if (!result || result.trim() === "ПУСТО") {
          voiceState.isProcessing = false;
          updateVoiceStatus("Говорите...", "Я слушаю вас");
          return;
        }

        const qMatch = result.match(/ВОПРОС:\s*(.+)/i);
        const aMatch = result.match(/ОТВЕТ:\s*([\s\S]+)/i);
        const question = qMatch ? qMatch[1].trim() : "Голосовой вопрос";
        const answer = aMatch ? aMatch[1].trim() : result.trim();

        const chat = getCurrentChat();
        if (chat.messages.length === 0) chat.title = question.slice(0, 36);
        chat.messages.push({ role: "user", text: question });
        chat.messages.push({ role: "model", text: answer });
        saveChats();
        renderMessages();

        if (/(код|html|скрипт|сайт|картинк|фото|нарисуй)/i.test(question) && !voiceState.docked) {
          dockVoiceCall();
        }

        speakText(answer);
      } catch (err) {
        updateVoiceStatus("Ошибка", err.message);
        voiceState.isProcessing = false;
      }
    }

    function speakText(text) {
      if (!voiceState.active) {
        voiceState.isProcessing = false;
        return;
      }
      const clean = text.replace(/```[\s\S]*?```/g, "Код в чате.").replace(/[*#`]/g, "");
      voiceState.isSpeaking = true;
      updateVoiceStatus("Говорит Maf GPT...", clean.slice(0, 110));
      document.getElementById("liveOrb").classList.add("voice-orb-speaking");

      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(clean);
        utter.lang = "ru-RU";
        utter.onend = () => {
          voiceState.isSpeaking = false;
          voiceState.isProcessing = false;
          document.getElementById("liveOrb").classList.remove("voice-orb-speaking");
          if (voiceState.active) updateVoiceStatus("Говорите...", "Я слушаю вас");
        };
        utter.onerror = () => {
          voiceState.isSpeaking = false;
          voiceState.isProcessing = false;
          document.getElementById("liveOrb").classList.remove("voice-orb-speaking");
        };
        window.speechSynthesis.speak(utter);
      } else {
        voiceState.isSpeaking = false;
        voiceState.isProcessing = false;
      }
    }

    function encodeWavBase64(chunks, sampleRate) {
      let total = 0;
      for (const c of chunks) total += c.length;
      const samples = new Float32Array(total);
      let off = 0;
      for (const c of chunks) { samples.set(c, off); off += c.length; }

      const buf = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buf);
      const writeStr = (p, s) => { for (let i = 0; i < s.length; i++) view.setUint8(p + i, s.charCodeAt(i)); };

      writeStr(0, "RIFF");
      view.setUint32(4, 36 + samples.length * 2, true);
      writeStr(8, "WAVE");
      writeStr(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, "data");
      view.setUint32(40, samples.length * 2, true);

      let pos = 44;
      for (let i = 0; i < samples.length; i++, pos += 2) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(pos, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }

      let bin = "";
      const bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.byteLength; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin);
    }

    function updateVoiceStatus(title, sub) {
      document.getElementById("liveStatusTitle").textContent = title;
      if (sub) document.getElementById("liveTranscriptText").textContent = sub;
      document.getElementById("dockedStatusText").textContent = title;
    }

    function toggleMute() {
      voiceState.muted = !voiceState.muted;
      document.getElementById("micOnIcon").classList.toggle("hidden", voiceState.muted);
      document.getElementById("micOffIcon").classList.toggle("hidden", !voiceState.muted);
      updateVoiceStatus(voiceState.muted ? "Микрофон выключен" : "Говорите...", voiceState.muted ? "Включите микрофон" : "Я слушаю вас");
    }

    function dockVoiceCall() {
      voiceState.docked = true;
      const overlay = document.getElementById("liveCallOverlay");
      overlay.classList.remove("screen-visible");
      overlay.classList.add("screen-hidden");
      setTimeout(() => {
        overlay.classList.add("hidden");
        overlay.classList.remove("flex");
      }, 300);

      const bar = document.getElementById("dockedCallBar");
      bar.classList.remove("hidden");
      requestAnimationFrame(() => {
        bar.classList.remove("screen-hidden");
        bar.classList.add("screen-visible");
      });
    }

    function expandVoiceCall() {
      voiceState.docked = false;
      const bar = document.getElementById("dockedCallBar");
      bar.classList.remove("screen-visible");
      bar.classList.add("screen-hidden");
      setTimeout(() => bar.classList.add("hidden"), 250);

      const overlay = document.getElementById("liveCallOverlay");
      overlay.classList.remove("hidden");
      overlay.classList.add("flex");
      requestAnimationFrame(() => {
        overlay.classList.remove("screen-hidden");
        overlay.classList.add("screen-visible");
      });
    }

    function endVoiceCall() {
      voiceState.active = false;
      voiceState.docked = false;
      voiceState.isSpeaking = false;
      voiceState.isProcessing = false;
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      if (voiceState.processor) { voiceState.processor.disconnect(); voiceState.processor = null; }
      if (voiceState.mediaStream) { voiceState.mediaStream.getTracks().forEach(t => t.stop()); voiceState.mediaStream = null; }

      document.getElementById("dockedCallBar").classList.add("hidden");
      const overlay = document.getElementById("liveCallOverlay");
      overlay.classList.remove("screen-visible");
      overlay.classList.add("screen-hidden");
      setTimeout(() => {
        overlay.classList.add("hidden");
        overlay.classList.remove("flex");
      }, 300);
    }

    setInterval(() => {
      const el = document.getElementById("dynamicGreeting");
      if (!el) return;
      el.classList.remove("greeting-visible");
      el.classList.add("greeting-hidden");
      setTimeout(() => {
        state.greetingIndex = (state.greetingIndex + 1) % GREETINGS.length;
        el.textContent = GREETINGS[state.greetingIndex];
        el.classList.remove("greeting-hidden");
        el.classList.add("greeting-visible");
      }, 480);
    }, 3600);

    document.addEventListener("DOMContentLoaded", () => {
      renderHistoryList();
      renderMessages();
    });
  </script>
