    /**
     * Форматирование Markdown и блоков кода с подсветкой синтаксиса
     */
    function normalizeCodeFenceText(text) {
      let normalized = String(text || '');
      // Нормализуем возможные экранированные или разорванные тройные обратные кавычки
      normalized = normalized.replace(/\\`\\`\\`/g, '```');

      // Если модель выдала открытый блок ``` без закрывающих кавычек
      const fenceMatches = normalized.match(/```/g);
      if (fenceMatches && fenceMatches.length % 2 === 1) {
        normalized = normalized + '\n```';
      }

      // Если нет тройных кавычек, но ответ содержит явный целый HTML/CSS/JS документ или кусок разметки с закрывающими тегами
      if (
        !/```/.test(normalized) &&
        (/<!doctype\s+html/i.test(normalized) ||
          (/<html[\s>]/i.test(normalized) && /<\/html>/i.test(normalized)) ||
          (/<script[\s>]/i.test(normalized) && /<\/script>/i.test(normalized)))
      ) {
        const htmlMatch = normalized.match(/(<!doctype\s+html[\s\S]*<\/html>|<html[\s\S]*<\/html>)/i);
        if (htmlMatch && htmlMatch[1]) {
          normalized = normalized.replace(htmlMatch[1], `\n\`\`\`html\n${htmlMatch[1].trim()}\n\`\`\`\n`);
        }
      }

      return normalized;
    }

    function renderRichMarkdown(text, isStreaming = false) {
      if (!text) return '';
      const codeBlocks = [];
      let processed = normalizeCodeFenceText(text).replace(/```([a-zA-Z0-9_+-]*)\r?\n([\s\S]*?)```/g, (_, lang, code) => {
        const idx = codeBlocks.length;
        const cleanLang = (lang || 'code').trim().toUpperCase();
        codeBlocks.push({ lang: cleanLang, code: code.replace(/\r?\n$/, '') });
        return `\n@@CODEBLOCK_${idx}@@\n`;
      });

      if (isStreaming && /```/.test(processed)) {
        processed = processed.replace(/```([a-zA-Z0-9_+-]*)\r?\n([\s\S]*)$/, (_, lang, code) => {
          const idx = codeBlocks.length;
          const cleanLang = (lang || 'code').trim().toUpperCase();
          codeBlocks.push({ lang: cleanLang, code });
          return `\n@@CODEBLOCK_${idx}@@\n`;
        });
      }

      const lines = processed.split(/\r?\n/);
      let html = '';
      let inUl = false;
      let inOl = false;
      let paraBuffer = [];

      const flushPara = () => {
        if (paraBuffer.length) {
          const joined = paraBuffer.join('<br/>');
          html += `<p>${formatInline(joined)}</p>`;
          paraBuffer = [];
        }
      };

      const closeLists = () => {
        if (inUl) { html += '</ul>'; inUl = false; }
        if (inOl) { html += '</ol>'; inOl = false; }
      };

      for (const rawLine of lines) {
        const line = rawLine.trimEnd();
        const cbMatch = line.trim().match(/^@@CODEBLOCK_(\d+)@@$/);
        if (cbMatch) {
          flushPara();
          closeLists();
          html += line.trim();
          continue;
        }

        if (!line.trim()) {
          flushPara();
          closeLists();
          continue;
        }

        if (line.startsWith('### ')) {
          flushPara(); closeLists();
          html += `<h3>${formatInline(line.slice(4))}</h3>`;
          continue;
        }
        if (line.startsWith('## ')) {
          flushPara(); closeLists();
          html += `<h2>${formatInline(line.slice(3))}</h2>`;
          continue;
        }
        if (line.startsWith('# ')) {
          flushPara(); closeLists();
          html += `<h1>${formatInline(line.slice(2))}</h1>`;
          continue;
        }
        if (line.startsWith('> ')) {
          flushPara(); closeLists();
          html += `<blockquote>${formatInline(line.slice(2))}</blockquote>`;
          continue;
        }

        const ulMatch = line.match(/^[-*]\s+(.*)$/);
        if (ulMatch) {
          flushPara();
          if (inOl) { html += '</ol>'; inOl = false; }
          if (!inUl) { html += '<ul>'; inUl = true; }
          html += `<li>${formatInline(ulMatch[1])}</li>`;
          continue;
        }

        const olMatch = line.match(/^\d+\.\s+(.*)$/);
        if (olMatch) {
          flushPara();
          if (inUl) { html += '</ul>'; inUl = false; }
          if (!inOl) { html += '<ol>'; inOl = true; }
          html += `<li>${formatInline(olMatch[1])}</li>`;
          continue;
        }

        closeLists();
        paraBuffer.push(line);
      }

      flushPara();
      closeLists();

      codeBlocks.forEach((block, idx) => {
        const highlighted = highlightCode(block.code);
        const encodedCode = escapeAttr(block.code);
        const blockId = `code-block-${Date.now()}-${idx}-${Math.random().toString(36).slice(2, 5)}`;
        const blockHtml = `
          <div class="code-wrapper">
            <div class="code-header">
              <div class="flex items-center gap-2 text-white">
                <svg class="h-4 w-4 text-neutral-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="16 18 22 12 16 6" />
                  <polyline points="8 6 2 12 8 18" />
                </svg>
                <span class="uppercase tracking-wide text-sm font-medium">${escapeHtml(block.lang)}</span>
              </div>
              <!-- Три аккуратные иконки в правом верхнем углу как на 2 фото: свернуть/развернуть, копировать, предпросмотр -->
              <div class="flex items-center gap-3.5 text-neutral-200">
                <button
                  type="button"
                  onclick="toggleCodeCollapse('${blockId}')"
                  title="Свернуть / развернуть"
                  aria-label="Свернуть или развернуть"
                  class="flex h-7 w-7 items-center justify-center rounded-lg bg-transparent text-neutral-200 transition hover:bg-[#3d3d3d] hover:text-white active:scale-95"
                >
                  <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 12h16" />
                    <path d="M12 4v5" />
                    <path d="M9 6l3 3 3-3" />
                    <path d="M12 20v-5" />
                    <path d="M9 18l3-3 3 3" />
                  </svg>
                </button>
                <button
                  type="button"
                  onclick="copyRawText(decodeAttr('${encodedCode}'))"
                  title="Копировать код"
                  aria-label="Копировать код"
                  class="flex h-7 w-7 items-center justify-center rounded-lg bg-transparent text-neutral-200 transition hover:bg-[#3d3d3d] hover:text-white active:scale-95"
                >
                  <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2.5" />
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                  </svg>
                </button>
                <button
                  type="button"
                  onclick="runCodePreview(decodeAttr('${encodedCode}'))"
                  title="Предпросмотр"
                  aria-label="Предпросмотр"
                  class="flex h-7 w-7 items-center justify-center rounded-lg bg-transparent text-neutral-200 transition hover:bg-[#3d3d3d] hover:text-white active:scale-95"
                >
                  <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="6 4 20 12 6 20 6 4" />
                  </svg>
                </button>
              </div>
            </div>
            <pre id="${blockId}" class="code-body"><code>${highlighted}</code></pre>
          </div>
        `;
        html = html.replace(`@@CODEBLOCK_${idx}@@`, blockHtml);
      });

      return html;
    }

    function toggleCodeCollapse(blockId) {
      const el = document.getElementById(blockId);
      if (el) {
        el.classList.toggle('code-collapsed');
      }
    }

    function runCodePreview(code) {
      const modal = document.getElementById('codePreviewModal');
      const frame = document.getElementById('codePreviewFrame');
      if (!modal || !frame) return;
      const trimmed = String(code || '').trim();
      const isHtml = /<html|<body|<div|<script|<style|<!doctype/i.test(trimmed);
      const isCss = !isHtml && /\{[\s\S]*:[\s\S]*\}/.test(trimmed) && !/\b(function|const|let|var|def|import|class)\b/.test(trimmed);

      if (isHtml) {
        frame.srcdoc = trimmed;
      } else if (isCss) {
        frame.srcdoc = `<!DOCTYPE html><html><head><style>${trimmed}</style></head><body style="background:#141414;color:#fff;font-family:Inter,sans-serif;padding:24px;"><h2>Предпросмотр стилей</h2><p class="demo-text">Пример текста для проверки CSS-правил.</p><button class="btn" style="padding:10px 18px;border-radius:8px;background:#2563eb;color:#fff;border:none;">Кнопка</button></body></html>`;
      } else {
        frame.srcdoc = `<!DOCTYPE html><html><head><meta charset="UTF-8" /><style>body{background:#111;color:#f5f5f5;font-family:'JetBrains Mono',monospace;padding:18px;margin:0;}#out{white-space:pre-wrap;background:#1b1b1b;padding:14px;border-radius:12px;border:1px solid #2e2e2e;min-height:80px;}</style></head><body><div style="font-family:Inter,sans-serif;font-size:13px;color:#a3a3a3;margin-bottom:10px;">Результат выполнения / код:</div><div id="out"></div><script>(function(){const out=document.getElementById('out');const log=(...a)=>out.textContent+=a.map(x=>typeof x==='object'?JSON.stringify(x,null,2):String(x)).join(' ')+'\\n';console.log=log;console.error=log;try{const fn=new Function(${JSON.stringify(trimmed)});const res=fn();if(res!==undefined)log('Результат:',res);if(!out.textContent)out.textContent=${JSON.stringify(trimmed)};}catch(e){out.textContent=${JSON.stringify(trimmed)};}})();<\/script></body></html>`;
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function formatInline(text) {
      let escaped = escapeHtml(text);
      escaped = escaped.replace(/`([^`]+)`/g, '<code class="rounded bg-[#262626] px-1.5 py-0.5 font-mono text-[13px] text-neutral-100">$1</code>');
      escaped = escaped.replace(/\*\*([^*]+)\*\*/g, '<strong class="font-semibold text-white">$1</strong>');
      escaped = escaped.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, '$1<em class="italic text-neutral-200">$2</em>');
      return escaped;
    }

    function highlightCode(code) {
      const raw = String(code ?? '');
      // Однопроходный токенизатор: исключает поломку тегов подсветки внутри строк и атрибутов
      const tokenRegex = /(&lt;!--[\s\S]*?--&gt;|\/\*[\s\S]*?\*\/|\/\/[^\n]*|#[^\n]*)|(&quot;(?:\\.|[^&]|&(?!quot;))*?&quot;|&#39;(?:\\.|[^&]|&(?!#39;))*?&#39;|`[^`]*`)|(&lt;\/?[a-zA-Z0-9-]+)|(\b\d+(?:\.\d+)?(?:px|rem|em|%|vh|vw|s|ms)?\b)|\b(const|let|var|function|return|if|else|for|while|class|import|export|from|async|await|try|catch|def|print|public|private|void|int|float|true|false|null|undefined|body|header|footer|section|div|style|script|html|head|meta|title)\b/g;

      const escaped = escapeHtml(raw);
      return escaped.replace(tokenRegex, (match, cmt, str, tag, num, kw) => {
        if (cmt) return `<span class="tok-cmt">${cmt}</span>`;
        if (str) return `<span class="tok-str">${str}</span>`;
        if (tag) return `<span class="tok-tag">${tag}</span>`;
        if (num) return `<span class="tok-num">${num}</span>`;
        if (kw) return `<span class="tok-kw">${kw}</span>`;
        return match;
      });
    }

    function updateLiveCallUI(statusText, subtitleText) {
      const statusEl = document.getElementById('liveCallStatus');
      const dockedStatusEl = document.getElementById('dockedCallStatus');
      const subEl = document.getElementById('liveCallSubtitle');
      if (statusEl && statusText !== undefined) statusEl.textContent = statusText;
      if (dockedStatusEl && statusText !== undefined) dockedStatusEl.textContent = statusText;
      if (subEl && subtitleText !== undefined) subEl.textContent = subtitleText;
    }

    function interruptCurrentSpeech() {
      if (liveState.currentAudioEl) {
        try {
          liveState.currentAudioEl.onended = null;
          liveState.currentAudioEl.onerror = null;
          liveState.currentAudioEl.pause();
          liveState.currentAudioEl.src = '';
        } catch (_) {}
        liveState.currentAudioEl = null;
      }
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch (_) {}
      }
      if (liveState.abortController) {
        try {
          liveState.abortController.abort();
        } catch (_) {}
        liveState.abortController = null;
      }
      liveState.isSpeaking = false;
      liveState.isProcessing = false;
      document.getElementById('liveVoiceOrb')?.classList.remove('voice-orb-speaking');
      document.getElementById('dockedVoiceOrb')?.classList.remove('voice-orb-speaking');
    }

    function updateMuteButtonUI() {
      const btn = document.getElementById('liveMuteBtn');
      const micOn = document.getElementById('micOnIcon');
      const micOff = document.getElementById('micOffIcon');
      const dBtn = document.getElementById('dockedMuteBtn');
      const dMicOn = document.getElementById('dockedMicOnIcon');
      const dMicOff = document.getElementById('dockedMicOffIcon');

      if (liveState.muted) {
        micOn?.classList.add('hidden');
        micOff?.classList.remove('hidden');
        btn?.classList.remove('bg-[#212121]');
        btn?.classList.add('bg-red-500/20');

        dMicOn?.classList.add('hidden');
        dMicOff?.classList.remove('hidden');
        dBtn?.classList.remove('bg-[#2c2c2c]');
        dBtn?.classList.add('bg-red-500/25');

        updateLiveCallUI('Микрофон выключен');
      } else {
        micOff?.classList.add('hidden');
        micOn?.classList.remove('hidden');
        btn?.classList.remove('bg-red-500/20');
        btn?.classList.add('bg-[#212121]');

        dMicOff?.classList.add('hidden');
        dMicOn?.classList.remove('hidden');
        dBtn?.classList.remove('bg-red-500/25');
        dBtn?.classList.add('bg-[#2c2c2c]');

        if (liveState.active && !liveState.isSpeaking && !liveState.isProcessing) {
          updateLiveCallUI('Говорите...');
        }
      }
    }

    function toggleLiveMute() {
      if (!liveState.active) return;
      liveState.muted = !liveState.muted;

      if (liveState.mediaStream) {
        liveState.mediaStream.getAudioTracks().forEach(track => {
          track.enabled = !liveState.muted;
        });
      }

      if (liveState.muted) {
        liveState.speechStarted = false;
        if (liveState.mediaRecorder && liveState.mediaRecorder.state === 'recording') {
          try { liveState.mediaRecorder.stop(); } catch (_) {}
        }
      }

      updateMuteButtonUI();
    }

    async function startLiveCall() {
      if (liveState.active) return;
      if (state.isGenerating) stopStreaming();

      liveState.active = true;
      liveState.collapsed = false;
      liveState.muted = false;
      liveState.isSpeaking = false;
      liveState.isProcessing = false;
      liveState.speechStarted = false;
      liveState.voiceHistory = [];
      setLiveCallCollapsed(false);
      updateMuteButtonUI();
      updateLiveCallUI('Подключение...', '');

      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('Браузер не поддерживает доступ к микрофону');
        }

        liveState.mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          },
        });

        if (!liveState.active) return;

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        liveState.audioContext = new AudioCtx();
        if (liveState.audioContext.state === 'suspended') {
          await liveState.audioContext.resume();
        }

        const source = liveState.audioContext.createMediaStreamSource(liveState.mediaStream);
        const analyser = liveState.audioContext.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = 0.25;
        source.connect(analyser);
        liveState.analyser = analyser;

        updateLiveCallUI('Говорите...', '');
        startVoiceActivityLoop();
      } catch (err) {
        showToast(err?.message || 'Нет доступа к микрофону');
        stopLiveCall();
      }
    }

    function beginSegmentRecording() {
      if (!liveState.active || !liveState.mediaStream || liveState.muted) return;
      if (liveState.mediaRecorder && liveState.mediaRecorder.state === 'recording') return;

      liveState.audioChunks = [];
      const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus'
        : MediaRecorder.isTypeSupported('audio/webm')
          ? 'audio/webm'
          : '';

      const recorder = mimeType
        ? new MediaRecorder(liveState.mediaStream, { mimeType })
        : new MediaRecorder(liveState.mediaStream);

      recorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) {
          liveState.audioChunks.push(e.data);
        }
      };

      recorder.onstop = async () => {
        liveState.mediaRecorder = null;
        if (!liveState.active || liveState.muted) return;
        const duration = Date.now() - liveState.speechStartTime;
        if (duration < 320 || !liveState.audioChunks.length) {
          liveState.isProcessing = false;
          if (liveState.active && !liveState.isSpeaking) {
            updateLiveCallUI('Говорите...');
          }
          return;
        }
        const audioBlob = new Blob(liveState.audioChunks, { type: recorder.mimeType || 'audio/webm' });
        liveState.audioChunks = [];
        await processVoiceTurn(audioBlob);
      };

      liveState.mediaRecorder = recorder;
      try {
        recorder.start(60);
      } catch (_) {
        liveState.mediaRecorder = null;
        liveState.speechStarted = false;
      }
    }

    function startVoiceActivityLoop() {
      const dataArray = new Uint8Array(liveState.analyser.frequencyBinCount);
      const BASE_THRESHOLD = 16;
      const BARGE_IN_THRESHOLD = 46;
      const SILENCE_MS = 220;

      const tick = () => {
        if (!liveState.active || !liveState.analyser) return;

        if (liveState.audioContext && liveState.audioContext.state === 'suspended') {
          liveState.audioContext.resume().catch(() => {});
        }

        liveState.analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 2; i < 64; i++) {
          sum += dataArray[i];
        }
        const avgVolume = sum / 62;

        // Анимация сферы от громкости голоса
        const orb = document.getElementById('liveVoiceOrb');
        const dockedOrb = document.getElementById('dockedVoiceOrb');
        if (!liveState.isSpeaking) {
          const scale = liveState.muted ? 1 : 1 + Math.min(0.16, (avgVolume / 120) * 0.16);
          if (orb) orb.style.transform = `scale(${scale.toFixed(3)})`;
          if (dockedOrb) dockedOrb.style.transform = `scale(${scale.toFixed(3)})`;
        }

        if (!liveState.muted) {
          const threshold = liveState.isSpeaking ? BARGE_IN_THRESHOLD : BASE_THRESHOLD;
          if (avgVolume > threshold) {
            if (liveState.isSpeaking) {
              interruptCurrentSpeech();
            }
            if (!liveState.isProcessing && !liveState.speechStarted) {
              liveState.speechStarted = true;
              liveState.speechStartTime = Date.now();
              liveState.silenceStart = 0;
              updateLiveCallUI('Слушаю...');
              beginSegmentRecording();
            } else if (liveState.speechStarted) {
              liveState.silenceStart = 0;
            }
          } else if (liveState.speechStarted) {
            if (!liveState.silenceStart) {
              liveState.silenceStart = Date.now();
            } else if (Date.now() - liveState.silenceStart >= SILENCE_MS) {
              liveState.speechStarted = false;
              liveState.silenceStart = 0;
              if (liveState.mediaRecorder && liveState.mediaRecorder.state === 'recording') {
                try {
                  liveState.mediaRecorder.stop();
                } catch (_) {
                  liveState.mediaRecorder = null;
                }
              }
            }
          }
        }

        liveState.rafId = requestAnimationFrame(tick);
      };

      liveState.rafId = requestAnimationFrame(tick);
    }

    async function speakVoiceReply(replyText, saveToChat = true) {
      if (!liveState.active || !replyText) return;

      if (liveState.currentAudioEl) {
        try {
          liveState.currentAudioEl.onended = null;
          liveState.currentAudioEl.onerror = null;
          liveState.currentAudioEl.pause();
        } catch (_) {}
        liveState.currentAudioEl = null;
      }

      liveState.isSpeaking = true;
      updateLiveCallUI('Отвечает...', replyText);

      const orb = document.getElementById('liveVoiceOrb');
      const dockedOrb = document.getElementById('dockedVoiceOrb');
      orb?.classList.add('voice-orb-speaking');
      dockedOrb?.classList.add('voice-orb-speaking');

      try {
        const apiKey = '';
        const ttsController = new AbortController();
        liveState.abortController = ttsController;

        const ttsRes = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: ttsController.signal,
            body: JSON.stringify({
              contents: [
                {
                  parts: [
                    {
                      text: `Прочитай естественно, энергично и в быстром живом разговорном темпе на русском языке: ${replyText}`,
                    },
                  ],
                },
              ],
              generationConfig: {
                responseModalities: ['AUDIO'],
                speechConfig: {
                  voiceConfig: {
                    prebuiltVoiceConfig: {
                      voiceName: 'Puck',
                    },
                  },
                },
              },
            }),
          }
        );

        if (!ttsRes.ok || !liveState.active) {
          throw new Error('TTS недоступен');
        }

        const ttsData = await ttsRes.json();
        const audioPart = (ttsData?.candidates?.[0]?.content?.parts || []).find(p => p.inlineData?.data);
        if (!audioPart?.inlineData?.data || !liveState.active) {
          throw new Error('Пустой аудиоответ');
        }

        const pcmBytes = base64ToUint8Array(audioPart.inlineData.data);
        const pcm16 = new Int16Array(pcmBytes.buffer, pcmBytes.byteOffset, Math.floor(pcmBytes.byteLength / 2));
        const wavBlob = pcmToWavBlob(pcm16, 24000);
        const audioUrl = URL.createObjectURL(wavBlob);

        const audioEl = new Audio(audioUrl);
        audioEl.playbackRate = 1.18;
        if ('preservesPitch' in audioEl) audioEl.preservesPitch = true;
        liveState.currentAudioEl = audioEl;

        const finishPlayback = () => {
          URL.revokeObjectURL(audioUrl);
          liveState.currentAudioEl = null;
          liveState.isSpeaking = false;
          liveState.isProcessing = false;
          liveState.speechStarted = false;
          orb?.classList.remove('voice-orb-speaking');
          dockedOrb?.classList.remove('voice-orb-speaking');
          if (liveState.active) {
            updateLiveCallUI(liveState.muted ? 'Микрофон выключен' : 'Говорите...');
          }
        };

        audioEl.onended = finishPlayback;
        audioEl.onerror = finishPlayback;

        await audioEl.play();
        if (saveToChat) {
          appendVoiceTurnToChat(saveToChat.userText || '', replyText);
        }
      } catch (err) {
        liveState.isProcessing = false;
        liveState.speechStarted = false;
        if (err?.name === 'AbortError' || !liveState.active) return;

        // Резервный мужской синтез речи браузера, если сетевой TTS недоступен
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(replyText);
          utter.lang = 'ru-RU';
          const voices = window.speechSynthesis.getVoices();
          const maleRuVoice = voices.find(v => /ru/i.test(v.lang) && /(dmitry|pavel|yuri|maxim|male|google русский)/i.test(v.name));
          if (maleRuVoice) utter.voice = maleRuVoice;
          utter.rate = 1.15;
          utter.pitch = 0.95;
          liveState.isSpeaking = true;
          const orb = document.getElementById('liveVoiceOrb');
          const dockedOrb = document.getElementById('dockedVoiceOrb');
          orb?.classList.add('voice-orb-speaking');
          dockedOrb?.classList.add('voice-orb-speaking');
          utter.onend = () => {
            liveState.isSpeaking = false;
            liveState.isProcessing = false;
            liveState.speechStarted = false;
            orb?.classList.remove('voice-orb-speaking');
            dockedOrb?.classList.remove('voice-orb-speaking');
            if (liveState.active) {
              updateLiveCallUI(liveState.muted ? 'Микрофон выключен' : 'Говорите...');
            }
          };
          utter.onerror = () => {
            liveState.isSpeaking = false;
            liveState.isProcessing = false;
          };
          window.speechSynthesis.speak(utter);
          if (saveToChat) appendVoiceTurnToChat(saveToChat.userText || '', replyText);
        } else {
          liveState.isSpeaking = false;
          updateLiveCallUI(liveState.muted ? 'Микрофон выключен' : 'Говорите...');
        }
      }
    }

    async function processVoiceTurn(audioBlob) {
      if (!liveState.active) return;
      liveState.isProcessing = true;
      liveState.abortController = new AbortController();
      updateLiveCallUI('Думает...');

      try {
        const base64Audio = await blobToBase64Raw(audioBlob);
        if (!base64Audio || !liveState.active) return;

        const apiKey = '';
        const cleanMime = (audioBlob.type || 'audio/webm').split(';')[0];

        // Анализируем СТРОГО ТОЛЬКО текущую аудиозапись без старой истории, чтобы прошлые просьбы о фото/коде не повторялись
        const recentContextSummary = liveState.voiceHistory
          .slice(-4)
          .map(m => `${m.role === 'user' ? 'Пользователь' : 'Maf GPT'}: ${m.parts?.[0]?.text || ''}`)
          .join('\n');

        const contents = [
          {
            role: 'user',
            parts: [
              {
                inlineData: {
                  mimeType: cleanMime,
                  data: base64Audio,
                },
              },
              {
                text:
                  'Прослушай ТОЛЬКО прикреплённую сейчас аудиозапись пользователя. Не повторяй прошлые команды из контекста!\n' +
                  (recentContextSummary ? `Краткий контекст предыдущего разговора (только для понимания темы, НЕ как новая команда):\n${recentContextSummary}\n\n` : '') +
                  'Ответь строго в формате JSON с полями:\n' +
                  '1) "type":\n' +
                  '   - "image" — ТОЛЬКО если пользователь ПРЯМО СЕЙЧАС в этой аудиозаписи вслух просит нарисовать/сгенерировать/создать новое фото или картинку;\n' +
                  '   - "code" — ТОЛЬКО если пользователь ПРЯМО СЕЙЧАС в этой аудиозаписи вслух просит написать/создать код или скрипт;\n' +
                  '   - "chat" — во всех остальных случаях (обычный вопрос, благодарность, уточнение, диалог);\n' +
                  '   - "silence" — если в аудио только шум, тишина, вздох или неразборчивые звуки.\n' +
                  '2) "prompt": точная расшифровка того, что сказал пользователь именно в этой аудиозаписи на русском языке.\n' +
                  '3) "voiceReply": краткий, живой голосовой ответ на русском языке без markdown-символов (1-2 предложения). Для "image" строго: "Я создаю фото по вашему запросу, ожидайте!". Для "code" строго: "Я создаю код по вашему запросу, ожидайте!".',
              },
            ],
          },
        ];

        const chatRes = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: liveState.abortController.signal,
            body: JSON.stringify({
              contents,
              generationConfig: {
                responseMimeType: 'application/json',
              },
            }),
          }
        );

        if (!chatRes.ok || !liveState.active) {
          throw new Error('Ошибка связи');
        }

        const chatData = await chatRes.json();
        const rawJsonText = (chatData?.candidates?.[0]?.content?.parts || [])
          .filter(p => !p.thought && p.text)
          .map(p => p.text)
          .join('')
          .trim();

        let parsed = { type: 'chat', prompt: '', voiceReply: '' };
        try {
          parsed = JSON.parse(rawJsonText);
        } catch (_) {
          parsed = { type: 'chat', prompt: '', voiceReply: sanitizeModelOutput(rawJsonText) };
        }

        const spokenPrompt = String(parsed.prompt || '').trim();
        if (!parsed.type || parsed.type === 'silence' || spokenPrompt.length < 2) {
          liveState.isProcessing = false;
          if (liveState.active && !liveState.muted) {
            updateLiveCallUI('Говорите...');
          }
          return;
        }

        // Дополнительная проверка: "image" разрешаем только если в текущей фразе реально есть просьба создать картинку
        const explicitlyAskedImage = isImageGenerationRequest(spokenPrompt, false);
        if (parsed.type === 'image' && !explicitlyAskedImage) {
          parsed.type = 'chat';
        }

        // Если голосом попросили фото — сворачиваем звонок вниз как на фото, говорим статус и генерируем картинку в чат!
        if (parsed.type === 'image') {
          setLiveCallCollapsed(true);
          const chat = getActiveChat();
          const imgPrompt = spokenPrompt;
          liveState.voiceHistory.push({ role: 'user', parts: [{ text: imgPrompt }] });
          liveState.voiceHistory.push({ role: 'model', parts: [{ text: 'Я создал фото по вашему запросу.' }] });

          if (chat) {
            chat.messages.push({ role: 'user', content: imgPrompt, timestamp: Date.now() });
            const assistantMsg = {
              role: 'assistant',
              content: '',
              generatedImageUrl: null,
              isImageJob: true,
              isStreaming: true,
              timestamp: Date.now(),
            };
            chat.messages.push(assistantMsg);
            startImageProgressAnimation();
            saveChats();
            renderSidebar();
            renderMessages();

            speakVoiceReply('Я создаю фото по вашему запросу, ожидайте!', false);

            try {
              const imgResult = await fetchGeneratedImage(imgPrompt, null);
              stopImageProgressAnimation();
              assistantMsg.generatedImageUrl = imgResult.imageUrl;
              assistantMsg.content = imgResult.answer;
              assistantMsg.isStreaming = false;
              saveChats();
              renderMessages();
              await speakVoiceReply('Я создал фото по вашему запросу, посмотрите в чате!', false);
            } catch (e) {
              stopImageProgressAnimation();
              assistantMsg.content = 'Не удалось создать изображение. Попробуйте ещё раз.';
              assistantMsg.isStreaming = false;
              saveChats();
              renderMessages();
            }
          }
          liveState.isProcessing = false;
          return;
        }

        // Дополнительная проверка для кода
        const explicitlyAskedCode = /(напиши|сделай|создай|сгенерируй).*(код|скрипт|программ|сайт|игру)|код на /i.test(spokenPrompt);
        if (parsed.type === 'code' && !explicitlyAskedCode) {
          parsed.type = 'chat';
        }

        // Если голосом попросили код — сворачиваем звонок вниз как на фото, создаём код в чат и сообщаем голосом!
        if (parsed.type === 'code') {
          setLiveCallCollapsed(true);
          const chat = getActiveChat();
          const codePrompt = spokenPrompt;
          liveState.voiceHistory.push({ role: 'user', parts: [{ text: codePrompt }] });
          liveState.voiceHistory.push({ role: 'model', parts: [{ text: 'Я создал код по вашему запросу.' }] });

          if (chat) {
            chat.messages.push({ role: 'user', content: codePrompt, timestamp: Date.now() });
            const assistantMsg = {
              role: 'assistant',
              content: 'Я создаю код по вашему запросу, ожидайте!',
              isStreaming: true,
              timestamp: Date.now(),
            };
            chat.messages.push(assistantMsg);
            saveChats();
            renderSidebar();
            renderMessages();

            speakVoiceReply('Я создаю код по вашему запросу, ожидайте!', false);

            try {
              const codePayload = await fetchTextResponse(chat.messages.slice(0, -1), state.reasoningLevel);
              assistantMsg.content = codePayload.answer;
              assistantMsg.isStreaming = false;
              saveChats();
              renderMessages();
              await speakVoiceReply('Я создал код по вашему запросу, он уже в чате!', false);
            } catch (e) {
              assistantMsg.content = 'Не удалось создать код. Попробуйте ещё раз.';
              assistantMsg.isStreaming = false;
              saveChats();
              renderMessages();
            }
          }
          liveState.isProcessing = false;
          return;
        }

        const replyText = sanitizeModelOutput(parsed.voiceReply || '')
          .replace(/[*#`>_~]/g, '')
          .replace(/\s+/g, ' ')
          .trim();

        if (!replyText) {
          liveState.isProcessing = false;
          if (liveState.active && !liveState.muted) {
            updateLiveCallUI('Говорите...');
          }
          return;
        }

        liveState.voiceHistory.push({ role: 'user', parts: [{ text: spokenPrompt }] });
        liveState.voiceHistory.push({ role: 'model', parts: [{ text: replyText }] });

        await speakVoiceReply(replyText, { userText: spokenPrompt });
      } catch (err) {
        liveState.isProcessing = false;
        liveState.isSpeaking = false;
        if (err?.name !== 'AbortError' && liveState.active) {
          updateLiveCallUI(liveState.muted ? 'Микрофон выключен' : 'Говорите...');
        }
      }
    }

    function appendVoiceTurnToChat(userText, modelText) {
      const chat = getActiveChat();
      if (!chat) return;

      if (userText) {
        chat.messages.push({
          role: 'user',
          content: userText,
          timestamp: Date.now(),
        });
      }

      if (modelText) {
        chat.messages.push({
          role: 'assistant',
          content: modelText,
          timestamp: Date.now(),
        });
      }

      chat.updatedAt = Date.now();
      saveChats();
      renderSidebar();
      renderMessages();
    }

    function stopLiveCall() {
      const wasActive = liveState.active;
      liveState.active = false;
      liveState.collapsed = false;
      liveState.muted = false;
      liveState.speechStarted = false;

      interruptCurrentSpeech();

      if (liveState.rafId) {
        cancelAnimationFrame(liveState.rafId);
        liveState.rafId = null;
      }

      setLiveCallCollapsed(false);

      if (liveState.mediaRecorder && liveState.mediaRecorder.state === 'recording') {
        try { liveState.mediaRecorder.stop(); } catch (_) {}
      }
      liveState.mediaRecorder = null;

      if (liveState.mediaStream) {
        liveState.mediaStream.getTracks().forEach(track => {
          try { track.stop(); } catch (_) {}
        });
        liveState.mediaStream = null;
      }

      if (liveState.audioContext) {
        try { liveState.audioContext.close(); } catch (_) {}
        liveState.audioContext = null;
      }
      liveState.analyser = null;

      if (wasActive) {
        showToast('Разговор завершён');
      }
    }

    function scrollToBottom() {
      const container = document.getElementById('messagesScroll');
      if (!container) return;
      requestAnimationFrame(() => {
        container.scrollTop = container.scrollHeight;
      });
    }

    function setGeneratingUI(isGenerating) {
      const stopBtn = document.getElementById('stopGeneratingBtn');
      const sendBtn = document.getElementById('sendBtn');
      if (stopBtn) {
        if (isGenerating) {
          stopBtn.classList.remove('hidden');
          stopBtn.classList.add('flex');
        } else {
          stopBtn.classList.add('hidden');
          stopBtn.classList.remove('flex');
        }
      }
      if (sendBtn) {
        sendBtn.disabled = Boolean(isGenerating);
      }
    }

    function stopStreaming() {
      if (state.abortController) {
        try {
          state.abortController.abort();
        } catch (_) {}
        state.abortController = null;
      }
      stopImageProgressAnimation();
      state.isGenerating = false;
      setGeneratingUI(false);

      const chat = getActiveChat();
      const lastMsg = chat?.messages?.[chat.messages.length - 1];
      if (lastMsg && lastMsg.role === 'assistant' && lastMsg.isStreaming) {
        lastMsg.isStreaming = false;
        if (!lastMsg.content && !lastMsg.generatedImageUrl) {
          lastMsg.content = 'Генерация остановлена.';
        }
        saveChats();
        renderMessages();
      }
    }

    function closeCodePreviewModal() {
      const modal = document.getElementById('codePreviewModal');
      const frame = document.getElementById('codePreviewFrame');
      if (frame) frame.srcdoc = '';
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    function base64ToUint8Array(base64) {
      const binary = atob(base64);
      const len = binary.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    function pcmToWavBlob(pcm16Array, sampleRate) {
      const numChannels = 1;
      const bitsPerSample = 16;
      const byteRate = (sampleRate * numChannels * bitsPerSample) / 8;
      const blockAlign = (numChannels * bitsPerSample) / 8;
      const dataSize = pcm16Array.byteLength;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      const writeStr = (offset, str) => {
        for (let i = 0; i < str.length; i++) {
          view.setUint8(offset + i, str.charCodeAt(i));
        }
      };

      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitsPerSample, true);
      writeStr(36, 'data');
      view.setUint32(40, dataSize, true);

      new Uint8Array(buffer, 44).set(new Uint8Array(pcm16Array.buffer, pcm16Array.byteOffset, dataSize));
      return new Blob([buffer], { type: 'audio/wav' });
    }

    function blobToBase64Raw(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const res = String(reader.result || '');
          const idx = res.indexOf(',');
          resolve(idx >= 0 ? res.slice(idx + 1) : res);
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    /**
     * Буфер обмена и уведомления
     */
    function copyRawText(text) {
      if (!text) return;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(
          () => showToast('Скопировано'),
          () => fallbackExecCopy(text)
        );
      } else {
        fallbackExecCopy(text);
      }
    }

    function fallbackExecCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('Скопировано');
      } catch (_) {
        showToast('Не удалось скопировать');
      }
      document.body.removeChild(ta);
    }

    let toastTimeout = null;
    function showToast(message) {
      const el = document.getElementById('toastBanner');
      if (!el) return;
      el.textContent = message;
      el.classList.remove('opacity-0');
      el.classList.add('opacity-100');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        el.classList.remove('opacity-100');
        el.classList.add('opacity-0');
      }, 2200);
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(str) {
      return encodeURIComponent(String(str ?? ''));
    }

    function decodeAttr(encoded) {
      try {
        return decodeURIComponent(encoded || '');
      } catch (_) {
        return '';
      }
    }

    function escapePlainError(msg) {
      return String(msg || 'ошибка сети').replace(/[`*]/g, '');
    }
  </script>
